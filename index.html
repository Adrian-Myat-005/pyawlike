<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body class="dark-mode">
    
    <div class="bottom-nav">
        <svg id="fsBtn" class="fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <div class="nav-dot" id="menuBtn"></div>
    </div>

    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw" checked></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
    </div>

    <div class="status-area">
        <div class="transcription" id="textDisplay"></div>
        <div class="wave-box" id="waveBox">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
        <div class="debug-line" id="statusLog" style="display:none;">SYSTEM READY</div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container">
            <button class="half-btn" id="btnMM"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const btnMM=document.getElementById('btnMM'), btnENG=document.getElementById('btnENG');
        const textDisplay=document.getElementById('textDisplay'), menu=document.getElementById('menu');
        const textSw=document.getElementById('textSw'), waveBox=document.getElementById('waveBox');
        const statusLog=document.getElementById('statusLog');
        const audioObj = new Audio();
        audioObj.volume = 1.0;
        
        let isRecording = false, recognition = null;

        function setStatus(msg) { 
            statusLog.innerText = msg; 
            console.log(msg);
        }

        function updateUI(recording) {
            const showText = textSw.checked;
            if (recording) {
                if (showText) {
                    textDisplay.style.display = 'block';
                    waveBox.style.display = 'none';
                } else {
                    textDisplay.style.display = 'none';
                    waveBox.style.display = 'flex';
                }
            } else {
                textDisplay.style.display = showText ? 'block' : 'none';
                waveBox.style.display = 'none';
            }
        }

        function forceUnlock() {
            audioObj.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            audioObj.play().then(() => { audioObj.pause(); audioObj.currentTime = 0; }).catch(()=>{});
        }

        async function hardReset() {
            isRec = false; isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            textDisplay.innerText = "";
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            masterAudio.pause();
            if (nativeMic) { try { await nativeMic.stop(); nativeMic.removeAllListeners(); } catch(e){} }
            else if (window.rec) { window.rec.stop(); }
        }

        async function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        }
        document.getElementById('fsBtn').addEventListener('click', toggleFS);
        document.getElementById('menuBtn').addEventListener('click', () => menu.classList.toggle('open'));

        function initMic(lang) {
            const Speech = window.webkitSpeechRecognition || window.speechRecognition;
            if (!Speech) { return null; }
            
            const rec = new Speech();
            rec.lang = lang;
            rec.continuous = false;
            rec.interimResults = true;

            rec.onstart = () => {
                isRecording = true;
                document.body.classList.add(lang === 'my-MM' ? 'active-left' : 'active-right');
                setStatus("LISTENING...");
                textDisplay.innerText = "";
                updateUI(true);
            };

            rec.onresult = (ev) => {
                let txt = '';
                for (let i = ev.resultIndex; i < ev.results.length; ++i) txt += ev.results[i][0].transcript;
                textDisplay.innerText = txt;
            };

            rec.onend = () => {
                isRecording = false;
                document.body.classList.remove('active-left', 'active-right');
                setStatus("TRANSLATING...");
                updateUI(false);
                
                const finalTxt = textDisplay.innerText;
                if (finalTxt && finalTxt.trim().length > 0) {
                    processJob(finalTxt, lang);
                } else {
                    setStatus("READY");
                    textDisplay.innerText = "";
                }
            };

            rec.onerror = (e) => { isRecording = false; updateUI(false); };
            return rec;
        }

        async function processJob(text, inputLang) {
            const isMM = inputLang === 'my-MM';
            const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const result = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = result;
                
                setStatus("SPEAKING...");
                playOutput(result, tl);
            } catch (e) { setStatus("TRANS FAIL"); }
        }

        function playOutput(text, lang) {
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;
            audioObj.src = url;
            audioObj.play().catch(e => {
                const u = new SpeechSynthesisUtterance(text);
                u.volume = 1.0;
                u.lang = lang === 'my' ? 'my-MM' : 'en-US';
                window.speechSynthesis.speak(u);
            });
            audioObj.onended = () => { setStatus("READY"); updateUI(false); };
        }

        function handleTap(lang) {
            forceUnlock();
            if (isRecording) {
                if (recognition) recognition.stop();
            } else {
                recognition = initMic(lang);
                if (recognition) recognition.start();
            }
        }

        btnMM.addEventListener('click', () => handleTap('my-MM'));
        btnENG.addEventListener('click', () => handleTap('en-US'));
        document.getElementById('themeSw').addEventListener('change', (e) => document.body.classList.toggle('dark-mode', e.target.checked));
        textSw.addEventListener('change', () => updateUI(isRecording));
    </script>
</body>
</html>
