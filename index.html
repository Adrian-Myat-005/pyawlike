<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="pyawlike.png">
    <link rel="apple-touch-icon" href="pyawlike.png">
    <link rel="manifest" href="manifest.json">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
</head>
<body class="">
    
    <div id="splash-screen">
        <img src="pyawlike.png" alt="PyawLike Logo" class="splash-logo">
        <div id="typewriter"></div>
    </div>

    <div class="bottom-nav" id="bottomNav">
        <svg id="fsBtn" class="fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <div class="nav-dot" id="menuBtn"></div>
        <div class="nav-plus" id="historyToggle">+</div>
    </div>

    <div class="history-page" id="historyPage">
        <div class="history-header">
            <div class="header-controls">
                <div class="clear-btn" id="clearHistory"></div>
                <div class="close-history" id="closeHistory">×</div>
            </div>
        </div>
        <div class="history-content" id="historyContent"></div>
    </div>

    <div class="dropdown" id="menu">
        <div class="menu-item" id="coffeeBtn" style="color: #d4af37; opacity: 1; font-weight: 900; border-bottom: 1px solid rgba(212,175,55,0.1); padding-bottom: 15px; margin-bottom: 20px;">
            BUY ME A COFFEE <span style="font-size: 14px;">☕</span>
        </div>
        <div class="menu-item" id="menuInstallItem">INSTALL APP <div class="nav-plus" style="position:static; transform:none; width:20px; height:20px; font-size:16px;">+</div></div>
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
    </div>

    <div class="status-area">
        <div class="transcription" id="textDisplay"></div>
        <div class="wave-container" id="waveContainer">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
    </div>

    <div class="speaker-wrapper" id="speakerWrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG"><span class="btn-label">ENG</span></button>
            <div id="stopDot" class="center-stop-dot"></div>
        </div>
    </div>

    <div id="title-bar">
        <div id="title-bar-text">PyawLike Flow</div>
    </div>

    <div id="pwa-overlay" class="pwa-overlay hidden"></div>
    <div id="pwa-install-popup" class="pwa-popup-top hidden">
        <div class="pwa-minimal-content">
            <div class="pwa-text">
                <p id="pwa-desc">Install PyawLike for a better experience.</p>
            </div>
            <div class="pwa-actions">
                <button id="pwa-install-btn" class="pwa-primary">Install</button>
                <button id="pwa-cancel-btn" class="pwa-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <div id="dic-popup">
        <div id="dic-loading" class="dic-loading">
            <div class="spinner"></div>
            <p style="margin-top:20px; font-weight:700; opacity:0.5; font-size: 12px; letter-spacing: 1px;">SEARCHING...</p>
        </div>
        <div class="dic-header">
            <div class="dic-back-btn" id="dicBackBtn">←</div>
            <div class="search-loader" id="searchLoader"></div>
            <div class="kb-input-container" id="kbInputContainer">
                <div class="lang-indicator" id="searchLangBtn">EN</div>
                <input type="text" id="kb-input" placeholder="Type word..." inputmode="none">
                <div id="kb-suggestions" class="kb-suggestions"></div>
            </div>
            <div class="close-history" id="closeDic">×</div>
        </div>
        <div id="dic-home-screen" class="dic-feed-container">
            <div class="relation-title">Recently Added</div>
            <div id="dicRecentWords" class="dic-blog-list"></div>
        </div>
        <div class="dic-word-section" id="dicWordSection" style="display:none">
            <div class="dic-word-row">
                <div class="dic-original" id="dicOriginal">Word</div>
                <div class="audio-btn" id="audioOriginal">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
            </div>
            <div class="dic-word-row" style="margin-top: 5px;">
                <div class="dic-translated" id="dicTranslated" style="margin-top: 0;">Translation</div>
                <div class="audio-btn mini" id="audioTranslated">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
            </div>
            <div class="dic-examples" id="dicExamples"></div>
            <div class="dic-relations">
                <div class="relation-box">
                    <div class="relation-title">Same</div>
                    <div class="relation-list" id="dicSynonyms"></div>
                </div>
                <div class="relation-box">
                    <div class="relation-title">Opposite</div>
                    <div class="relation-list" id="dicAntonyms"></div>
                </div>
                <div class="relation-box">
                    <div class="relation-title">Acronym</div>
                    <div class="relation-list" id="dicAcronyms"></div>
                </div>
                <div class="relation-box" id="dicRelatedBox" style="display:none">
                    <div class="relation-title">Related</div>
                    <div class="relation-list" id="dicRelated"></div>
                </div>
            </div>
        </div>
        <div class="dic-footer">
            <div class="mic-btn" id="searchMicBtn">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </div>
        </div>
    </div>

    <div id="coffee-popup" class="pwa-popup-top hidden" style="top: 50%; transform: translate(-50%, -50%); height: auto; border-radius: 30px; border-bottom: none; box-shadow: var(--tactile-shadow);">
        <div class="pwa-minimal-content" style="border-radius: 30px;">
            <div class="pwa-text">
                <p style="font-size: 18px; font-weight: 900; margin-bottom: 5px;">☕ Support PyawLike</p>
                <p id="coffee-step-text" style="font-size: 13px; opacity: 0.6;">Choose an amount to donate</p>
            </div>
            
            <!-- Step 1: Amounts -->
            <div id="coffee-amounts" class="pwa-actions" style="flex-wrap: wrap; gap: 10px;">
                <button class="pwa-secondary amount-btn" data-amt="2000">2000 MMK</button>
                <button class="pwa-secondary amount-btn" data-amt="3000">3000 MMK</button>
                <button class="pwa-secondary amount-btn" data-amt="5000">5000 MMK</button>
                <button class="pwa-secondary amount-btn" data-amt="10000">10000 MMK</button>
            </div>

            <!-- Step 2: Payment Methods -->
            <div id="coffee-methods" class="pwa-actions hidden" style="gap: 10px;">
                <button class="pwa-primary method-btn" data-method="kpay">KBZ Pay</button>
                <button class="pwa-secondary method-btn" data-method="wave" style="opacity: 0.5;">WavePay</button>
            </div>

            <div class="pwa-actions">
                <button id="coffee-cancel-btn" class="pwa-secondary" style="width: 100%; margin-top: 10px;">Cancel</button>
            </div>
        </div>
    </div>

    <div id="custom-keyboard">
        <div class="kb-circle" id="kbCircle"></div>
    </div>

    <script src="pwa-popup.js"></script>
    <script>
        const btnMM=document.getElementById('btnMM'), btnENG=document.getElementById('btnENG'), mainCircle=document.getElementById('mainCircle');
        const textDisplay=document.getElementById('textDisplay'), menu=document.getElementById('menu'), waveContainer=document.getElementById('waveContainer');
        const textSw=document.getElementById('textSw'), speakerWrapper=document.getElementById('speakerWrapper');
        const stopDot=document.getElementById('stopDot'), menuBtn=document.getElementById('menuBtn');
        const historyToggle=document.getElementById('historyToggle'), historyPage=document.getElementById('historyPage'), historyContent=document.getElementById('historyContent'), clearHistory=document.getElementById('clearHistory'), closeHistory=document.getElementById('closeHistory');
        
        const audioObj = new Audio();
        const clickSound = new Audio('click_eff.mp3');
        let isRecording = false, recognition = null, isRecordingHistory = false;

        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => {});
        }

        // --- HISTORY LOGIC ---
        function saveToHistory(text, lang, translated) {
            if (!isRecordingHistory) return;
            const history = JSON.parse(localStorage.getItem('tr_history') || '[]');
            history.push({ 
                id: Date.now(),
                time: new Date().toLocaleTimeString(), 
                input: text, 
                inputLang: lang === 'my-MM' ? 'MM' : 'ENG',
                output: translated,
                outputLang: lang === 'my-MM' ? 'ENG' : 'MM'
            });
            localStorage.setItem('tr_history', JSON.stringify(history));
            renderHistory();
        }

        function deleteHistoryItem(id) {
            const history = JSON.parse(localStorage.getItem('tr_history') || '[]');
            const filtered = history.filter(h => h.id !== id);
            localStorage.setItem('tr_history', JSON.stringify(filtered));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('tr_history') || '[]');
            historyContent.innerHTML = history.slice().reverse().map(h => `
                <div class="history-item">
                    <div class="h-item-header">
                        <div class="h-time">${h.time}</div>
                        <div class="delete-item" onclick="event.stopPropagation(); deleteHistoryItem(${h.id})">×</div>
                    </div>
                    <div class="h-row"><strong>${h.inputLang}:</strong> ${h.input}</div>
                    <div class="h-row"><strong>${h.outputLang}:</strong> ${h.output}</div>
                </div>
            `).join('');
        }

        clearHistory.addEventListener('click', () => {
            localStorage.removeItem('tr_history');
            renderHistory();
        });

        closeHistory.addEventListener('click', () => {
            historyPage.classList.remove('open');
        });

        let historyClickTimeout;
        historyToggle.addEventListener('click', (e) => {
            if (e.detail === 1) {
                historyClickTimeout = setTimeout(() => {
                    playClickSound();
                    isRecordingHistory = !isRecordingHistory;
                    historyToggle.innerText = isRecordingHistory ? "REC" : "+";
                    historyToggle.classList.toggle('recording', isRecordingHistory);
                }, 250);
            } else if (e.detail === 2) {
                clearTimeout(historyClickTimeout);
                playClickSound();
                historyPage.classList.toggle('open');
                if (historyPage.classList.contains('open')) renderHistory();
            }
        });

        // --- MENU ---
        menuBtn.addEventListener('click', () => menu.classList.toggle('open'));
        textSw.addEventListener('change', (e) => {
            const show = e.target.checked;
            textDisplay.style.display = show ? 'block' : 'none';
            if (!show && isRecording) waveContainer.classList.add('visible');
            else waveContainer.classList.remove('visible');
        });

        // --- MIC ---
        let isSwitching = false;
        function initMic(lang) {
            const Speech = window.webkitSpeechRecognition || window.speechRecognition;
            if (!Speech) return null;
            
            if (recognition) {
                recognition.onstart = recognition.onresult = recognition.onerror = recognition.onend = null;
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }

            const rec = new Speech();
            rec.lang = lang; rec.continuous = false; rec.interimResults = true;
            
            rec.onstart = () => {
                isRecording = true;
                document.body.classList.add(lang === 'my-MM' ? 'active-left' : 'active-right');
                if (!textSw.checked) waveContainer.classList.add('visible');
            };
            rec.onerror = (err) => {
                isRecording = false;
                speakerWrapper.classList.remove('active-rec-ui');
                waveContainer.classList.remove('visible');
            };
            rec.onresult = (ev) => {
                let final = '', interim = '';
                for (let i = ev.resultIndex; i < ev.results.length; ++i) {
                    if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
                    else interim += ev.results[i][0].transcript;
                }
                textDisplay.innerText = final + interim; 
                if (textSw.checked) textDisplay.classList.add('visible'); 
            };
            rec.onend = () => {
                if (isSwitching) return;
                isRecording = false;
                document.body.classList.remove('active-left', 'active-right');
                speakerWrapper.classList.remove('active-rec-ui');
                waveContainer.classList.remove('visible');
                const finalTxt = textDisplay.innerText;
                if (finalTxt) processJob(finalTxt, lang);
                recognition = null;
            };
            return rec;
        }

        async function processJob(text, inputLang) {
            const isMM = inputLang === 'my-MM', sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const result = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = result;
                textDisplay.classList.add('visible');
                playOutput(result, tl);
                
                if (isRecordingHistory) saveToHistory(text, inputLang, result);

                // Clear text after 3 seconds
                setTimeout(() => {
                    textDisplay.classList.remove('visible');
                    setTimeout(() => { if(!textDisplay.classList.contains('visible')) textDisplay.innerText = ''; }, 500);
                }, 3000);
            } catch (e) {}
        }

        async function playOutput(text, lang) {
            try {
                const tl = (lang === 'my' || lang === 'my-MM') ? 'my' : 'en';
                const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${tl}&client=tw-ob`;
                audioObj.src = url;
                await audioObj.play();
            } catch (e) {
                // Fallback to local API
                try {
                    const voice = (lang === 'my' || lang === 'my-MM') ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                    const res = await fetch(`/api/edge`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, voice }) });
                    if (res.ok) { audioObj.src = URL.createObjectURL(await res.blob()); await audioObj.play(); }
                } catch (err) {}
            }
        }

        function handleTap(lang) { 
            if(!isRecording) { recognition = initMic(lang); recognition?.start(); } 
            else recognition?.stop(); 
        }

        // --- SPLIT RECORDER LOGIC ---
        const activateSplit = (e) => {
            if (!speakerWrapper.classList.contains('split-active')) {
                speakerWrapper.classList.add('split-active');
            }
        };
        speakerWrapper.addEventListener('mousedown', activateSplit);
        speakerWrapper.addEventListener('touchstart', activateSplit);
        speakerWrapper.addEventListener('click', activateSplit);

        btnENG.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            playClickSound();
            if (isRecording && recognition.lang !== 'en-US') {
                isSwitching = true;
                recognition.onend = () => { isSwitching = false; handleTap('en-US'); };
                recognition.stop();
            } else handleTap('en-US');
        });

        btnMM.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            playClickSound();
            if (isRecording && recognition.lang !== 'my-MM') {
                isSwitching = true;
                recognition.onend = () => { isSwitching = false; handleTap('my-MM'); };
                recognition.stop();
            } else handleTap('my-MM'); 
        });

        stopDot.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            playClickSound();
            isSwitching = false;
            if(isRecording && recognition) recognition.stop(); 
            speakerWrapper.classList.remove('split-active'); 
        });

        window.addEventListener('click', (e) => {
            if (menu.classList.contains('open') && !menu.contains(e.target) && e.target.id !== 'menuBtn') menu.classList.remove('open');
            if (historyPage.classList.contains('open') && !historyPage.contains(e.target) && e.target.id !== 'historyToggle') historyPage.classList.remove('open');
        });

        document.getElementById('themeSw').addEventListener('change', (e) => document.body.classList.toggle('dark-mode', e.target.checked));
        document.getElementById('fsBtn').addEventListener('click', () => { !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen(); });
        
        document.getElementById('coffeeBtn').addEventListener('click', () => {
            playClickSound();
            menu.classList.remove('open');
            document.getElementById('coffee-popup').classList.remove('hidden');
            showCoffeeStep(1);
        });

        const coffeePopup = document.getElementById('coffee-popup');
        const coffeeStepText = document.getElementById('coffee-step-text');
        const coffeeAmounts = document.getElementById('coffee-amounts');
        const coffeeMethods = document.getElementById('coffee-methods');
        let selectedAmount = 0;

        function showCoffeeStep(step) {
            if (step === 1) {
                coffeeStepText.innerText = "Choose an amount to donate";
                coffeeAmounts.classList.remove('hidden');
                coffeeMethods.classList.add('hidden');
            } else {
                coffeeStepText.innerText = `Choose payment for ${selectedAmount} MMK`;
                coffeeAmounts.classList.add('hidden');
                coffeeMethods.classList.remove('hidden');
            }
        }

        document.querySelectorAll('.amount-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                playClickSound();
                selectedAmount = btn.getAttribute('data-amt');
                showCoffeeStep(2);
            });
        });

        document.querySelectorAll('.method-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                playClickSound();
                const method = btn.getAttribute('data-method');
                if (method === 'kpay') {
                    // 1. Copy phone number to clipboard (Standard fallback in Myanmar)
                    const phone = "09971171628";
                    navigator.clipboard.writeText(phone).then(() => {
                        coffeeStepText.innerText = `Phone number ${phone} copied! Opening KPay...`;
                    });

                    // 2. KBZ Pay Deep Link (Primary attempt)
                    const kpayUrl = `kbzpay://p2p/transfer?phoneno=${phone}&amount=${selectedAmount}`;
                    
                    // Try different methods to trigger the app
                    window.location.href = kpayUrl;
                    
                    // 3. Auto-close and instructions after a delay
                    setTimeout(() => {
                        coffeePopup.classList.add('hidden');
                        textDisplay.innerText = "If KPay didn't open, please use the copied number 09971171628 manually.";
                        textDisplay.classList.add('visible');
                    }, 2000);
                    return; // Avoid immediate hide so user sees the "Copied" message
                } else if (method === 'wave') {
                    // Placeholder for WavePay
                    alert("WavePay integration coming soon!");
                }
                coffeePopup.classList.add('hidden');
            });
        });

        document.getElementById('coffee-cancel-btn').addEventListener('click', () => {
            playClickSound();
            coffeePopup.classList.add('hidden');
        });
        
        // Initial render
        renderHistory();

        // --- SPLASH SCREEN & TYPEWRITER ---
        const splashScreen = document.getElementById('splash-screen');
        const typewriterElement = document.getElementById('typewriter');
        const appName = "pyawlike";
        let charIndex = 0;

        function type() {
            if (charIndex < appName.length) {
                typewriterElement.textContent += appName.charAt(charIndex);
                charIndex++;
                setTimeout(type, 150);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(type, 300); // Start typewriter after a small delay
            setTimeout(() => {
                splashScreen.classList.add('fade-out');
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                }, 500);
            }, 2500); // Total splash time
        });
    </script>
    <script src="dictionary.js"></script>
</body>
</html>
