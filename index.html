<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Continuous</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body class="dark-mode">
    <div id="debug-log" style="position:fixed;top:10px;left:10px;right:10px;max-height:40px;background:rgba(0,0,0,0.5);color:#0f0;font-family:monospace;font-size:10px;padding:5px;overflow:hidden;z-index:10000;border-radius:5px;pointer-events:none;opacity:0.5;">Continuous Mode Active</div>
    
    <div class="top-nav"><div class="nav-dot" id="menuBtn"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw" checked></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">NATURAL VOICE <input type="checkbox" id="naturalSw" checked></div>
    </div>

    <div class="status-area">
        <div class="transcription" id="textDisplay">READY</div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('debug-log');
        const textDisplay = document.getElementById('textDisplay');
        const masterAudio = new Audio();
        let isRec = false, masterBuffer = '', finalBuffer = '', curLang = 'en-US';

        function log(msg) { logArea.innerText = msg; }

        const Speech = (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.SpeechRecognition : null;

        async function checkPermissions() {
            if (Speech) {
                try {
                    await Speech.requestPermissions();
                    log("Mic Ready");
                } catch (e) { log("Mic Denied"); }
            }
        }

        // --- CORE CONTINUOUS MIC ENGINE ---
        async function runMic() {
            if (!isRec) return;
            try {
                log("Mic Active...");
                await Speech.start({ 
                    language: curLang, 
                    partialResults: true, 
                    popup: false,
                    continuous: true // Request continuous mode from native
                });
            } catch (e) {
                log("Mic Error: " + e.message);
                if (isRec) setTimeout(runMic, 100); // Try restart if still holding
            }
        }

        async function start(lang, side) {
            if (isRec) return;
            isRec = true;
            masterBuffer = '';
            finalBuffer = '';
            curLang = lang;
            
            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            textDisplay.innerText = "Listening...";
            textDisplay.style.color = "#4a90e2";

            if (Speech) {
                Speech.removeAllListeners();
                
                // Partial results update the current "live" view
                Speech.addListener('partialResults', (data) => {
                    if (data.matches && data.matches.length > 0) {
                        const currentText = data.matches[0];
                        finalBuffer = (masterBuffer + " " + currentText).trim();
                        textDisplay.innerText = finalBuffer;
                    }
                });

                // Final results (when the engine pauses) are saved to the master buffer
                Speech.addListener('results', (data) => {
                    if (data.matches && data.matches.length > 0) {
                        masterBuffer = (masterBuffer + " " + data.matches[0]).trim();
                        finalBuffer = masterBuffer;
                        log("Segment Saved");
                        // If still holding, the engine might have stopped. We ensure it's running.
                        if (isRec) runMic(); 
                    }
                });

                await runMic();
            } else {
                // Browser Sim
                setTimeout(() => { finalBuffer = "Hello world"; textDisplay.innerText = finalBuffer; }, 1000);
            }
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false;
            document.body.classList.remove('active-left', 'active-right');
            log("Processing...");
            
            if (Speech) {
                try { await Speech.stop(); } catch (e) {}
                Speech.removeAllListeners();
            }

            setTimeout(async () => {
                if (finalBuffer) {
                    textDisplay.style.color = "var(--text)";
                    textDisplay.innerText = "TRANSLATING...";
                    await translate(finalBuffer);
                } else {
                    textDisplay.innerText = "READY";
                }
            }, 500);
        }

        async function translate(text) {
            const isMM = curLang.startsWith('my');
            const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const translated = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = translated;
                await speak(translated, tl);
            } catch (e) { textDisplay.innerText = "ERROR"; }
        }

        async function speak(text, lang) {
            const natural = document.getElementById('naturalSw').checked;
            if (natural) {
                try {
                    const url = window.ENV?.SERVER_URL || 'https://pyawlike.vercel.app';
                    const res = await fetch(`${url}/api/tts`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ text, lang })
                    });
                    const data = await res.json();
                    if (data.audio) {
                        const b = new Blob([Uint8Array.from(atob(data.audio), c => c.charCodeAt(0))], {type:'audio/wav'});
                        masterAudio.src = URL.createObjectURL(b);
                        masterAudio.play();
                        return;
                    }
                } catch (e) {}
            }
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang === 'my' ? 'my-MM' : 'en-US';
            window.speechSynthesis.speak(u);
        }

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); start(lang, side); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); btn.releasePointerCapture(e.pointerId); stopRecording(); });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        checkPermissions();
    </script>
</body>
</html>
