<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PyawLike - Nilar Default</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body class="dark-mode">
    <div id="error" style="position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:red;color:white;padding:10px 20px;border-radius:20px;display:none;z-index:10000;font-size:12px;"></div>
    
    <div class="top-nav"><div class="nav-dot" id="menuBtn"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw" checked></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">GEMINI VOICE <input type="checkbox" id="naturalSw"></div>
    </div>

    <div class="status-area"><div class="transcription" id="textDisplay">Ready</div></div>

    <div class="speaker-wrapper">
        <div class="split-btn-container">
            <button class="half-btn" id="btnMM" data-lang="my-MM"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const btnMM=document.getElementById('btnMM'), btnENG=document.getElementById('btnENG');
        const textDisplay=document.getElementById('textDisplay'), menu=document.getElementById('menu');
        const errToast=document.getElementById('error');
        const nativeMic = window.Capacitor ? Capacitor.Plugins.SpeechRecognition : null;
        const masterAudio = new Audio();
        let isRec = false, finalBuffer = '';

        // --- 1. RECORDING ---
        function attach(btn, inputLang, targetLang, side) {
            btn.addEventListener('pointerdown', async (e) => {
                e.preventDefault(); 
                if(isRec) { stop(); return; }
                
                document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
                textDisplay.innerText = "Listening...";
                window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
                isRec = true;
                btn.setPointerCapture(e.pointerId);

                if(nativeMic) {
                    try {
                        await nativeMic.requestPermissions(); 
                        await nativeMic.start({ language: inputLang, maxResults: 1, popup: true });
                        nativeMic.addListener('partialResults', (d) => {
                            if(d.matches && d.matches.length > 0) {
                                finalBuffer = d.matches[0];
                                textDisplay.innerText = finalBuffer;
                            }
                        });
                    } catch(e) { stop(); showErr("Mic Error"); }
                } else {
                    setTimeout(() => { finalBuffer = "Hello Test"; stop(inputLang, targetLang); }, 1500);
                }
            });

            btn.addEventListener('pointerup', (e) => {
                btn.releasePointerCapture(e.pointerId);
                stop(inputLang, targetLang); 
            });
        }

        async function stop(inputLang, targetLang) {
            if(!isRec) return;
            isRec = false;
            document.body.classList.remove('active-left', 'active-right');
            if(nativeMic) { try { await nativeMic.stop(); nativeMic.removeAllListeners(); } catch(e){} }
            
            if(finalBuffer && finalBuffer.trim().length > 0) {
                textDisplay.innerText = "Translating...";
                await processTranslation(finalBuffer, inputLang, targetLang);
                finalBuffer = "";
            } else { textDisplay.innerText = "Ready"; }
        }

        async function processTranslation(text, inputLang, targetLang) {
            try {
                const sl = inputLang.startsWith('my') ? 'my' : 'en';
                const tl = targetLang.startsWith('my') ? 'my' : 'en';
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const translatedText = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = translatedText;
                await speak(translatedText, targetLang);
            } catch(e) { showErr("Trans Fail"); }
        }

        // --- 2. SPEAKING (The Critical Update) ---
        async function speak(text, lang) {
            const useGemini = document.getElementById('naturalSw').checked;
            
            // OPTION A: GEMINI (Only if toggled ON)
            if(useGemini) {
                try {
                    const url = window.ENV?.SERVER_URL || 'https://pyawlike.vercel.app';
                    const res = await fetch(`${url}/api/tts`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ text, lang: lang.startsWith('my')?'my':'en' })
                    });
                    const data = await res.json();
                    if(data.audio) {
                        const b = new Blob([Uint8Array.from(atob(data.audio), c => c.charCodeAt(0))], {type:'audio/wav'});
                        masterAudio.src = URL.createObjectURL(b);
                        masterAudio.play();
                        return;
                    }
                } catch(e) { console.warn("Gemini limit reached, falling back to Edge."); }
            }

            // OPTION B: EDGE TTS (DEFAULT FOR BURMESE)
            // This is the specific logic you asked for:
            try {
                if(typeof EdgeTTS !== 'undefined') {
                    // FORCE 'NilarNeural' for Burmese
                    const voice = lang.startsWith('my') ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                    console.log("Using Edge Voice:", voice);
                    
                    const tts = new EdgeTTS.EdgeTTS();
                    await tts.speak({ text: text, voice: voice });
                    return;
                }
            } catch(e) { console.error("Edge TTS Failed", e); }

            // OPTION C: SYSTEM OFFLINE (Fallback)
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            window.speechSynthesis.speak(u);
        }

        function showErr(m) { errToast.innerText=m; errToast.style.display='block'; setTimeout(()=>errToast.style.display='none',3000); }

        attach(btnMM, 'my-MM', 'en-US', 'left');
        attach(btnENG', 'en-US', 'my-MM', 'right');
        
        document.getElementById('menuBtn').addEventListener('click', () => menu.classList.toggle('open'));
        document.getElementById('themeSw').addEventListener('change', (e) => document.body.classList.toggle('dark-mode', e.target.checked));
    </script>
</body>
</html>
