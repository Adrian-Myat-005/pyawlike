<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike - Nilar Default</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body class="dark-mode">
    <div id="error" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:red;color:white;padding:10px 20px;border-radius:20px;display:none;z-index:10000;font-size:12px;"></div>
    
    <div class="bottom-nav">
        <svg id="fsBtn" class="fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <div class="nav-dot" id="menuBtn"></div>
    </div>

    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw" checked></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">GEMINI VOICE <input type="checkbox" id="naturalSw"></div>
    </div>

    <div class="status-area"><div class="transcription" id="textDisplay">Ready</div></div>

    <div class="speaker-wrapper">
        <div class="split-btn-container">
            <button class="half-btn" id="btnMM" data-lang="my-MM"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const btnMM=document.getElementById('btnMM'), btnENG=document.getElementById('btnENG');
        const textDisplay=document.getElementById('textDisplay'), menu=document.getElementById('menu');
        const errToast=document.getElementById('error');
        const nativeMic = window.Capacitor ? Capacitor.Plugins.SpeechRecognition : null;
        const masterAudio = new Audio();
        let isRec = false, finalBuffer = '';

        // --- 1. FULLSCREEN ENGINE ---
        async function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else if (document.exitFullscreen) document.exitFullscreen();
        }
        document.getElementById('fsBtn').addEventListener('click', toggleFS);

        // --- 2. RECORDING ENGINE (Logic Protected) ---
        function attach(btn, inputLang, targetLang, side) {
            btn.addEventListener('pointerdown', async (e) => {
                e.preventDefault(); 
                if(isProcessing) return;
                
                // Toggle Logic Support
                if(isRec) { stop(inputLang, targetLang); return; }
                
                document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
                textDisplay.innerText = "Listening...";
                // Audio Prime for Android
                masterAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                masterAudio.play().catch(()=>{});
                
                isRec = true;
                btn.setPointerCapture(e.pointerId);

                if(nativeMic) {
                    try {
                        await nativeMic.requestPermissions(); 
                        await nativeMic.start({ language: inputLang, partialResults: true, popup: false, continuous: true });
                        
                        // LOGIC SAFETY: Catch both event types
                        nativeMic.addListener('partialResults', (d) => {
                            if(d.matches && d.matches.length > 0) {
                                finalBuffer = d.matches[0];
                                if(document.getElementById('textSw').checked) textDisplay.innerText = finalBuffer;
                            }
                        });
                        nativeMic.addListener('results', (d) => {
                            if(d.matches && d.matches.length > 0) finalBuffer = d.matches[0];
                        });
                    } catch(e) { stop(inputLang, targetLang); showErr("Mic Error"); }
                } else if ('webkitSpeechRecognition' in window) {
                    if (!window.rec) {
                        const SpeechReq = window.webkitSpeechRecognition || window.speechRecognition;
                        window.rec = new SpeechReq();
                        window.rec.continuous = true;
                        window.rec.interimResults = true;
                        window.rec.onresult = (ev) => {
                            let full = '';
                            for (let i = ev.resultIndex; i < ev.results.length; ++i) full += ev.results[i][0].transcript;
                            finalBuffer = full.trim();
                            if(document.getElementById('textSw').checked) textDisplay.innerText = finalBuffer;
                        };
                    }
                    window.rec.lang = inputLang;
                    window.rec.start();
                }
            });

            btn.addEventListener('pointerup', (e) => {
                btn.releasePointerCapture(e.pointerId);
                // Only stop if we are actually recording
                if(isRec) stop(inputLang, targetLang); 
            });
        }

        let isProcessing = false;
        async function stop(inputLang, targetLang) {
            if(!isRec) return;
            isRec = false;
            isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            
            if(nativeMic) { try { await nativeMic.stop(); nativeMic.removeAllListeners(); } catch(e){} }
            else if(window.rec) { window.rec.stop(); }
            
            setTimeout(async () => {
                if(finalBuffer && finalBuffer.trim().length > 0) {
                    textDisplay.innerText = "Translating...";
                    await processTranslation(finalBuffer, inputLang, targetLang);
                    finalBuffer = "";
                } else { 
                    textDisplay.innerText = "Ready"; 
                    isProcessing = false;
                }
            }, 400);
        }

        async function processTranslation(text, inputLang, targetLang) {
            try {
                const sl = inputLang.startsWith('my') ? 'my' : 'en';
                const tl = targetLang.startsWith('my') ? 'my' : 'en';
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const translatedText = data[0].map(s => s[0]).join('').trim();
                if(document.getElementById('textSw').checked) textDisplay.innerText = translatedText;
                await speak(translatedText, targetLang);
            } catch(e) { showErr("Trans Fail"); isProcessing = false; }
        }

        async function speak(text, lang) {
            const useGemini = document.getElementById('naturalSw').checked;
            
            if(useGemini) {
                try {
                    const url = window.ENV?.SERVER_URL || window.location.origin;
                    const res = await fetch(`${url}/api/tts`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ text, lang: lang.startsWith('my')?'my':'en' })
                    });
                    const data = await res.json();
                    if(data.audio) {
                        const b = new Blob([Uint8Array.from(atob(data.audio), c => c.charCodeAt(0))], {type:'audio/wav'});
                        masterAudio.src = URL.createObjectURL(b);
                        masterAudio.onended = () => { isProcessing = false; };
                        await masterAudio.play();
                        return;
                    }
                } catch(e) {}
            }

            try {
                if(typeof EdgeTTS !== 'undefined') {
                    const voice = lang.startsWith('my') ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                    const tts = new EdgeTTS.EdgeTTS();
                    // Using direct synthesis for more stable callback control
                    const audioData = await tts.synthesize(text, voice);
                    const blob = new Blob([audioData], { type: 'audio/mp3' });
                    const url = URL.createObjectURL(blob);
                    masterAudio.src = url;
                    masterAudio.onended = () => { URL.revokeObjectURL(url); isProcessing = false; };
                    await masterAudio.play();
                    return;
                }
            } catch(e) {}

            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            u.onend = () => { isProcessing = false; };
            window.speechSynthesis.speak(u);
        }

        function showErr(m) { errToast.innerText=m; errToast.style.display='block'; setTimeout(()=>errToast.style.display='none',3000); }

        attach(btnMM, 'my-MM', 'en-US', 'left');
        attach(btnENG', 'en-US', 'my-MM', 'right');
        
        document.getElementById('menuBtn').addEventListener('click', () => menu.classList.toggle('open'));
        document.getElementById('themeSw').addEventListener('change', (e) => document.body.classList.toggle('dark-mode', e.target.checked));
    </script>
</body>
</html>
