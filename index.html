<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Robust Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body class="">
    <div id="debug-log" style="position:fixed;top:10px;left:10px;right:10px;max-height:40px;background:rgba(0,0,0,0.1);color:var(--text);font-family:monospace;font-size:10px;padding:5px;overflow:hidden;z-index:10000;border-radius:5px;pointer-events:none;opacity:0.5;">Initializing Pro Engine...</div>
    
    <div class="top-nav" id="menuBtn"><div class="nav-dot"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">NATURAL VOICE <input type="checkbox" id="naturalSw" checked></div>
    </div>

    <div class="status-area">
        <div class="transcription" id="textDisplay">READY</div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('debug-log');
        const textDisplay = document.getElementById('textDisplay');
        const masterAudio = new Audio();
        let isRec = false, isProcessing = false, curLang = 'en-US';
        let currentTranscript = '';
        let wakeLock = null;

        function log(msg) { logArea.innerText = msg; console.log(msg); }

        function forceResetUI() {
            isRec = false; isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            textDisplay.innerText = "READY";
            textDisplay.style.color = "var(--text)";
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            masterAudio.pause();
        }

        // --- SPEECH ENGINE (V6 ROBUST) ---
        let Speech = null;
        let recognition = null;

        async function initSpeech() {
            Speech = (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.SpeechRecognition : null;
            
            if (Speech) {
                try {
                    const available = await Speech.available();
                    if (available.available) {
                        log("Engine Ready");
                        await checkPermissions();
                    } else {
                        log("Device not supported");
                    }
                } catch (e) { log("Init Error"); }
            } else if ('webkitSpeechRecognition' in window) {
                log("Web Mode");
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let full = '';
                    for (let i = 0; i < e.results.length; ++i) {
                        full += e.results[i][0].transcript;
                    }
                    currentTranscript = full.trim();
                    textDisplay.innerText = currentTranscript || "Listening...";
                };
                recognition.onend = () => { if (isRec) try { recognition.start(); } catch(e) {} };
            }
        }

        async function checkPermissions() {
            if (!Speech) return;
            try {
                const status = await Speech.checkPermissions();
                if (status.speechRecognition !== 'granted') {
                    log("Requesting Access...");
                    await Speech.requestPermissions();
                }
            } catch (e) { log("Permission Fail"); }
        }

        async function start(lang, side) {
            if (isRec || isProcessing) return;
            
            // Pro Safeguard: Check if already listening
            if (Speech) {
                const check = await Speech.isListening();
                if (check.listening) {
                    await Speech.stop();
                    await new Promise(r => setTimeout(r, 100));
                }
            }

            isRec = true;
            currentTranscript = '';
            curLang = lang;

            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            textDisplay.innerText = "Listening...";
            textDisplay.style.color = "var(--accent)";

            if (Speech) {
                Speech.removeAllListeners();
                Speech.addListener('partialResults', (data) => {
                    if (data.matches && data.matches.length > 0) {
                        currentTranscript = data.matches[0];
                        textDisplay.innerText = currentTranscript;
                    }
                });

                try {
                    await Speech.start({
                        language: curLang,
                        partialResults: true,
                        popup: false,
                        continuous: true
                    });
                } catch (e) { log("Start Error"); isRec = false; }
            } else if (recognition) {
                recognition.lang = curLang;
                try { recognition.start(); } catch(e) {}
            }
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false;
            isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            log("Processing...");

            if (Speech) {
                try { await Speech.stop(); } catch(e) {}
                Speech.removeAllListeners();
            } else if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            setTimeout(async () => {
                if (currentTranscript) {
                    textDisplay.style.color = "var(--text)";
                    textDisplay.innerText = "...";
                    await translate(currentTranscript);
                } else {
                    forceResetUI();
                }
            }, 600);
        }

        async function translate(text) {
            const isMM = curLang.startsWith('my');
            const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const result = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = result;
                await speak(result, tl);
            } catch (e) { log("Net Error"); forceResetUI(); }
        }

        async function speak(text, lang) {
            const natural = document.getElementById('naturalSw').checked;
            let success = false;

            if (natural) {
                try {
                    const url = window.ENV?.SERVER_URL || window.location.origin;
                    const res = await fetch(`${url}/api/tts`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ text, lang, apiKey: window.ENV?.GEMINI_API_KEY })
                    });
                    const data = await res.json();
                    if (data.audio) {
                        const blob = new Blob([Uint8Array.from(atob(data.audio), c => c.charCodeAt(0))], {type:'audio/wav'});
                        const url = URL.createObjectURL(blob);
                        masterAudio.src = url;
                        masterAudio.onended = () => { URL.revokeObjectURL(url); isProcessing = false; };
                        await masterAudio.play();
                        success = true;
                    }
                } catch (e) { log("Gemini Fail"); }
            }

            if (!success) {
                if (!window.SpeechSynthesisUtterance) { isProcessing = false; return; }
                const u = new SpeechSynthesisUtterance(text);
                u.lang = (lang === 'my') ? 'my-MM' : 'en-US';
                u.onend = () => { isProcessing = false; };
                u.onerror = () => { isProcessing = false; };
                window.speechSynthesis.speak(u);
            }
        }

        function unlockAudio() {
            masterAudio.play().then(() => { masterAudio.pause(); }).catch(() => {});
            if (window.speechSynthesis) {
                try { window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch(e) {}
            }
            window.removeEventListener('pointerdown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); start(lang, side); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); btn.releasePointerCapture(e.pointerId); stopRecording(); });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        document.getElementById('themeSw').addEventListener('change', () => document.body.classList.toggle('dark-mode'));

        document.addEventListener('deviceready', initSpeech, false);
        setTimeout(() => { if (!Speech && !recognition) initSpeech(); }, 2000);
    </script>
</body>
</html>
