<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike - Hybrid Mic</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body class="dark-mode">
    <div id="error-toast" style="position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(255,50,50,0.9); color:white; padding:12px 24px; border-radius:30px; font-size:14px; z-index:2000; display:none;"></div>

    <div class="top-nav">
        <div class="nav-dot" id="navDot"></div>
        <span class="perm-status" id="permStatus">OFF</span>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <div class="menu-item"><span>DARK MODE</span><label class="switch small-switch"><input type="checkbox" id="themeSwitch" checked><span class="slider"></span></label></div>
        <div class="menu-item"><span>SHOW TEXT</span><label class="switch small-switch"><input type="checkbox" id="showTextSwitch"><span class="slider"></span></label></div>
        <div class="menu-item"><span>NATURAL VOICE</span><label class="switch small-switch"><input type="checkbox" id="naturalSwitch"><span class="slider"></span></label></div>
    </div>

    <div class="status-area">
        <div class="horizontal-waves" id="hWaves"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="text-display-area" id="transcription"></div>
        <div class="processing-loader" id="pLoader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
    </div>

    <div class="speaker-wrapper" id="speakerWrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn left" id="btnMM"><span class="btn-label">MM</span></button>
            <button class="half-btn right" id="btnENG"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        // --- SETUP ---
        const btnMM = document.getElementById('btnMM'), btnENG = document.getElementById('btnENG');
        const hWaves = document.getElementById('hWaves'), pLoader = document.getElementById('pLoader'), transcription = document.getElementById('transcription');
        const errorToast = document.getElementById('error-toast'), permStatus = document.getElementById('permStatus');
        const showTextSwitch = document.getElementById('showTextSwitch'), themeSwitch = document.getElementById('themeSwitch'), naturalSwitch = document.getElementById('naturalSwitch');
        
        const masterAudio = new Audio();
        let isRecording = false, finalBuffer = '', currentMicLang = 'en-US';

        // 🛑 NATIVE MIC PLUGIN 🛑
        const NativeSpeech = window.Capacitor ? Capacitor.Plugins.SpeechRecognition : null;

        // --- 1. FORCE PERMISSIONS (THE FIX) ---
        async function checkPerms() {
            if (NativeSpeech) {
                try {
                    // This line forces the popup to appear
                    const status = await NativeSpeech.requestPermissions();
                    updateSwitch(status.speechRecognition === 'granted' || status.microphone === 'granted');
                } catch (e) { console.error("Perm Error:", e); }
            }
        }

        // --- 2. RECORDING LOGIC ---
        async function startRecording(lang) {
            wakeUpAudio();
            currentMicLang = lang;
            updateUIState('listening');
            
            if (NativeSpeech) {
                // Use Native Plugin
                try {
                    await NativeSpeech.start({ language: lang, maxResults: 1, partialResults: true, popup: false });
                    NativeSpeech.addListener('partialResults', (data) => {
                        if (data.matches && data.matches.length > 0) {
                            finalBuffer = data.matches[0];
                            if (showTextSwitch.checked) updateDisplay(finalBuffer);
                        }
                    });
                    isRecording = true;
                } catch (e) { resetUI(); }
            }
        }

        async function stopRecording() {
            updateUIState('processing');
            isRecording = false;
            if (NativeSpeech) {
                try { await NativeSpeech.stop(); NativeSpeech.removeAllListeners(); } catch(e){}
            }
            setTimeout(() => {
                if (finalBuffer) processTranslation(finalBuffer);
                else resetUI();
            }, 500);
        }

        // --- 3. TRANSLATION & TTS ---
        const AppCache = {
            get: (text, tl) => localStorage.getItem(`pyawlike_${text.trim().toLowerCase()}_${tl}`),
            set: (text, tl, res) => { try { localStorage.setItem(`pyawlike_${text.trim().toLowerCase()}_${tl}`, res); } catch(e){} }
        };

        async function processTranslation(text) {
            if (!text || !text.trim()) { resetUI(); return; }
            const isMM = currentMicLang === 'my-MM';
            const sl = isMM ? 'my' : 'en'; const tl = isMM ? 'en' : 'my';

            const cached = AppCache.get(text, tl);
            if (cached) { updateDisplay(cached); await speakLogic(cached, tl); return; }

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                const translated = data[0].map(s => s[0]).join('').trim();
                AppCache.set(text, tl, translated);
                updateDisplay(translated);
                await speakLogic(translated, tl);
            } catch (e) { showError("Network Error"); resetUI(); }
        }

        async function speakLogic(text, lang) {
            if (naturalSwitch.checked) {
                try {
                    const serverUrl = window.ENV?.SERVER_URL || '';
                    const resp = await fetch(`${serverUrl}/api/tts`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ text, lang }) });
                    const data = await resp.json();
                    if (data.audio) {
                        const blob = new Blob([Uint8Array.from(atob(data.audio), c => c.charCodeAt(0))], { type: 'audio/wav' });
                        masterAudio.src = URL.createObjectURL(blob);
                        masterAudio.play(); masterAudio.onended = resetUI; return;
                    }
                } catch (e) {}
            }
            try {
                if (typeof EdgeTTS !== 'undefined') {
                    const voice = lang === 'my' ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                    const tts = new EdgeTTS.EdgeTTS();
                    await tts.speak({ text: text, voice: voice });
                    setTimeout(resetUI, (text.length * 100) + 1500); return;
                }
            } catch(e) {}
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang === 'my' ? 'my-MM' : 'en-US';
            u.onend = resetUI; window.speechSynthesis.speak(u);
        }

        function wakeUpAudio() { const s = new SpeechSynthesisUtterance(""); window.speechSynthesis.speak(s); }
        function updateUIState(state) {
            pLoader.classList.toggle('active', state === 'processing');
            if (state === 'listening') {
                if (showTextSwitch.checked) { hWaves.classList.remove('active'); transcription.classList.add('active'); transcription.innerHTML = '<div class="live-line" style="opacity:0.5">Listening...</div>'; }
                else { transcription.classList.remove('active'); hWaves.classList.add('active'); }
            } else if (state === 'ready') { hWaves.classList.remove('active'); if (!showTextSwitch.checked) transcription.classList.remove('active'); }
        }
        function updateDisplay(text) { if (showTextSwitch.checked) { transcription.classList.add('active'); transcription.innerHTML = `<div class="live-line">${text}</div>`; } }
        function resetUI() { updateUIState('ready'); finalBuffer = ''; }
        function showError(msg) { errorToast.textContent = msg; errorToast.style.display = 'block'; setTimeout(()=>errorToast.style.display='none', 3000); }
        function updateSwitch(on) { permStatus.textContent = on ? 'ON' : 'ERR'; permStatus.classList.toggle('active', on); }

        btnMM.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording('my-MM'); });
        btnMM.addEventListener('mouseup', stopRecording);
        btnENG.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording('en-US'); });
        btnENG.addEventListener('mouseup', stopRecording);
        document.getElementById('navDot').addEventListener('click', () => document.getElementById('dropdownMenu').classList.toggle('active'));
        themeSwitch.addEventListener('change', (e) => document.body.classList.toggle('dark-mode', e.target.checked));
        
        // 🚀 CHECK PERMISSIONS ON START 🚀
        (async()=>{ await checkPerms(); })();
    </script>
</body>
</html>
