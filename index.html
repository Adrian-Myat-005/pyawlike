<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
</head>
<body class="">
    
    <div class="bottom-nav" id="bottomNav">
        <svg id="fsBtn" class="fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <div class="nav-dot" id="menuBtn"></div>
        <div class="nav-plus" id="historyToggle">+</div>
    </div>

    <div class="history-page" id="historyPage">
        <div class="history-header">
            <div class="header-controls">
                <div class="clear-btn" id="clearHistory"></div>
                <div class="close-history" id="closeHistory">×</div>
            </div>
        </div>
        <div class="history-content" id="historyContent"></div>
    </div>

    <div class="dropdown" id="menu">
        <div class="menu-item" id="menuInstallItem">INSTALL APP <div class="nav-plus" style="position:static; transform:none; width:20px; height:20px; font-size:16px;">+</div></div>
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
    </div>

    <div class="status-area">
        <div class="transcription" id="textDisplay"></div>
        <div class="wave-container" id="waveContainer">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
    </div>

    <div class="speaker-wrapper" id="speakerWrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG"><span class="btn-label">ENG</span></button>
            <div id="stopDot" class="center-stop-dot"></div>
        </div>
    </div>

    <div id="title-bar">
        <div id="title-bar-text">PyawLike Flow</div>
    </div>

    <div id="pwa-overlay" class="pwa-overlay hidden"></div>
    <div id="pwa-install-popup" class="pwa-popup-top hidden">
        <div class="pwa-minimal-content">
            <div class="pwa-text">
                <p id="pwa-desc">Install PyawLike for a better experience.</p>
            </div>
            <div class="pwa-actions">
                <button id="pwa-install-btn" class="pwa-primary">Install</button>
                <button id="pwa-cancel-btn" class="pwa-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="pwa-popup.js"></script>
    <script>
        const btnMM=document.getElementById('btnMM'), btnENG=document.getElementById('btnENG'), mainCircle=document.getElementById('mainCircle');
        const textDisplay=document.getElementById('textDisplay'), menu=document.getElementById('menu'), waveContainer=document.getElementById('waveContainer');
        const textSw=document.getElementById('textSw'), speakerWrapper=document.getElementById('speakerWrapper');
        const stopDot=document.getElementById('stopDot'), menuBtn=document.getElementById('menuBtn');
        const historyToggle=document.getElementById('historyToggle'), historyPage=document.getElementById('historyPage'), historyContent=document.getElementById('historyContent'), clearHistory=document.getElementById('clearHistory'), closeHistory=document.getElementById('closeHistory');
        
        const audioObj = new Audio();
        let isRecording = false, recognition = null, isRecordingHistory = false;

        // --- HISTORY LOGIC ---
        function saveToHistory(text, lang, translated) {
            if (!isRecordingHistory) return;
            const history = JSON.parse(localStorage.getItem('tr_history') || '[]');
            history.push({ 
                id: Date.now(),
                time: new Date().toLocaleTimeString(), 
                input: text, 
                inputLang: lang === 'my-MM' ? 'MM' : 'ENG',
                output: translated,
                outputLang: lang === 'my-MM' ? 'ENG' : 'MM'
            });
            localStorage.setItem('tr_history', JSON.stringify(history));
            renderHistory();
        }

        function deleteHistoryItem(id) {
            const history = JSON.parse(localStorage.getItem('tr_history') || '[]');
            const filtered = history.filter(h => h.id !== id);
            localStorage.setItem('tr_history', JSON.stringify(filtered));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('tr_history') || '[]');
            historyContent.innerHTML = history.slice().reverse().map(h => `
                <div class="history-item">
                    <div class="h-item-header">
                        <div class="h-time">${h.time}</div>
                        <div class="delete-item" onclick="event.stopPropagation(); deleteHistoryItem(${h.id})">×</div>
                    </div>
                    <div class="h-row"><strong>${h.inputLang}:</strong> ${h.input}</div>
                    <div class="h-row"><strong>${h.outputLang}:</strong> ${h.output}</div>
                </div>
            `).join('');
        }

        clearHistory.addEventListener('click', () => {
            localStorage.removeItem('tr_history');
            renderHistory();
        });

        closeHistory.addEventListener('click', () => {
            historyPage.classList.remove('open');
        });

        let historyClickTimeout;
        historyToggle.addEventListener('click', (e) => {
            if (e.detail === 1) {
                historyClickTimeout = setTimeout(() => {
                    isRecordingHistory = !isRecordingHistory;
                    historyToggle.innerText = isRecordingHistory ? "REC" : "+";
                    historyToggle.classList.toggle('recording', isRecordingHistory);
                }, 250);
            } else if (e.detail === 2) {
                clearTimeout(historyClickTimeout);
                historyPage.classList.toggle('open');
                if (historyPage.classList.contains('open')) renderHistory();
            }
        });

        // --- MENU ---
        menuBtn.addEventListener('click', () => menu.classList.toggle('open'));
        textSw.addEventListener('change', (e) => {
            const show = e.target.checked;
            textDisplay.style.display = show ? 'block' : 'none';
            if (!show && isRecording) waveContainer.classList.add('visible');
            else waveContainer.classList.remove('visible');
        });

        // --- MIC ---
        let isSwitching = false;
        function initMic(lang) {
            const Speech = window.webkitSpeechRecognition || window.speechRecognition;
            if (!Speech) return null;
            
            if (recognition) {
                recognition.onstart = recognition.onresult = recognition.onerror = recognition.onend = null;
                try { recognition.stop(); } catch(e) {}
                recognition = null;
            }

            const rec = new Speech();
            rec.lang = lang; rec.continuous = false; rec.interimResults = true;
            
            rec.onstart = () => {
                isRecording = true;
                document.body.classList.add(lang === 'my-MM' ? 'active-left' : 'active-right');
                if (!textSw.checked) waveContainer.classList.add('visible');
            };
            rec.onerror = (err) => {
                isRecording = false;
                speakerWrapper.classList.remove('active-rec-ui');
                waveContainer.classList.remove('visible');
            };
            rec.onresult = (ev) => {
                let final = '', interim = '';
                for (let i = ev.resultIndex; i < ev.results.length; ++i) {
                    if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
                    else interim += ev.results[i][0].transcript;
                }
                textDisplay.innerText = final + interim; 
                if (textSw.checked) textDisplay.classList.add('visible'); 
            };
            rec.onend = () => {
                if (isSwitching) return;
                isRecording = false;
                document.body.classList.remove('active-left', 'active-right');
                speakerWrapper.classList.remove('active-rec-ui');
                waveContainer.classList.remove('visible');
                const finalTxt = textDisplay.innerText;
                if (finalTxt) processJob(finalTxt, lang);
                recognition = null;
            };
            return rec;
        }

        async function processJob(text, inputLang) {
            const isMM = inputLang === 'my-MM', sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const result = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = result;
                textDisplay.classList.add('visible');
                playOutput(result, tl);
                
                if (isRecordingHistory) saveToHistory(text, inputLang, result);

                // Clear text after 3 seconds
                setTimeout(() => {
                    textDisplay.classList.remove('visible');
                    setTimeout(() => { if(!textDisplay.classList.contains('visible')) textDisplay.innerText = ''; }, 500);
                }, 3000);
            } catch (e) {}
        }

        async function playOutput(text, lang) {
            try {
                const voice = (lang === 'my' || lang === 'my-MM') ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                const res = await fetch(`https://pyawlike.vercel.app/api/edge`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, voice }) });
                if (res.ok) { audioObj.src = URL.createObjectURL(await res.blob()); await audioObj.play(); }
            } catch (e) {}
        }

        function handleTap(lang) { 
            if(!isRecording) { recognition = initMic(lang); recognition?.start(); } 
            else recognition?.stop(); 
        }

        // --- SPLIT RECORDER LOGIC ---
        const activateSplit = (e) => {
            if (!speakerWrapper.classList.contains('split-active')) {
                speakerWrapper.classList.add('split-active');
            }
        };
        speakerWrapper.addEventListener('mousedown', activateSplit);
        speakerWrapper.addEventListener('touchstart', activateSplit);
        speakerWrapper.addEventListener('click', activateSplit);

        btnENG.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            if (isRecording && recognition.lang !== 'en-US') {
                isSwitching = true;
                recognition.onend = () => { isSwitching = false; handleTap('en-US'); };
                recognition.stop();
            } else handleTap('en-US');
        });

        btnMM.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            if (isRecording && recognition.lang !== 'my-MM') {
                isSwitching = true;
                recognition.onend = () => { isSwitching = false; handleTap('my-MM'); };
                recognition.stop();
            } else handleTap('my-MM'); 
        });

        stopDot.addEventListener('click', (e) => { 
            e.stopPropagation(); 
            isSwitching = false;
            if(isRecording && recognition) recognition.stop(); 
            speakerWrapper.classList.remove('split-active'); 
        });

        window.addEventListener('click', (e) => {
            if (menu.classList.contains('open') && !menu.contains(e.target) && e.target.id !== 'menuBtn') menu.classList.remove('open');
            if (historyPage.classList.contains('open') && !historyPage.contains(e.target) && e.target.id !== 'historyToggle') historyPage.classList.remove('open');
        });

        document.getElementById('themeSw').addEventListener('change', (e) => document.body.classList.toggle('dark-mode', e.target.checked));
        document.getElementById('fsBtn').addEventListener('click', () => { !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen(); });
        
        // Initial render
        renderHistory();
    </script>
</body>
</html>
