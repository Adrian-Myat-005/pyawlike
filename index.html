<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Robust Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
    <style>
        :root { --circle-size: clamp(220px, 50vw, 300px); }
        body { background: var(--bg); transition: 0.3s; overflow: hidden; }
        
        /* High-Quality Floating Glass Card */
        .status-area {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw;
            max-width: 500px;
            min-height: 140px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            z-index: 10000;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        body.dark-mode .status-area {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .transcription { 
            font-size: 26px; 
            font-weight: 800; 
            color: var(--text); 
            text-align: center;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .status-badge { 
            font-size: 11px; 
            font-weight: 900; 
            letter-spacing: 3px; 
            color: var(--accent); 
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .speaker-wrapper { position: fixed; bottom: 12%; left: 50%; transform: translateX(-50%); z-index: 1000; }
    </style>
</head>
<body class="">
    <div id="debug-log" style="position:fixed;top:10px;left:10px;right:10px;max-height:40px;background:rgba(0,0,0,0.05);color:var(--text);font-family:monospace;font-size:10px;padding:5px;overflow:hidden;z-index:100000;border-radius:5px;opacity:0.6;">Fluent Engine Initializing...</div>
    
    <div class="top-nav" id="menuBtn"><div class="nav-dot"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">NATURAL VOICE <input type="checkbox" id="naturalSw" checked></div>
        <div class="menu-item">CONTINUOUS <input type="checkbox" id="contSw" checked></div>
        <button onclick="testVoice()" style="background:var(--accent);color:white;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;margin-top:10px;cursor:pointer;font-size:12px;">TEST QUALITY BURMESE</button>
        <button onclick="hardReset()" style="background:#ff4444;color:white;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;margin-top:15px;cursor:pointer;font-size:12px;">HARD RESET</button>
    </div>

    <div class="status-area">
        <div class="status-badge" id="stateBadge">READY</div>
        <div class="transcription" id="textDisplay">READY</div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('debug-log');
        const textDisplay = document.getElementById('textDisplay');
        const stateBadge = document.getElementById('stateBadge');
        let masterAudio = new Audio();
        
        let isRec = false, isProcessing = false;
        let curLang = 'en-US', currentTranscript = '';
        let recognition = null;

        function log(msg) { logArea.innerText = msg; console.log(msg); }
        function setUIState(state) { stateBadge.innerText = state; }

        async function hardReset() {
            log("Engine Reset...");
            isRec = false; isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('READY');
            textDisplay.innerText = "READY";
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            masterAudio.pause();
            masterAudio.src = "";
            if (recognition) { try { recognition.stop(); } catch(e) {} }
        }

        async function initSystem() {
            if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
                const SpeechReq = window.webkitSpeechRecognition || window.speechRecognition;
                recognition = new SpeechReq();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let full = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) full += e.results[i][0].transcript;
                    currentTranscript = full.trim();
                    textDisplay.innerText = currentTranscript || "Listening...";
                };
                recognition.onend = () => { if (isRec) try { recognition.start(); } catch(e) {} };
                log("Neural Mic Engine Ready");
            }
        }

        async function start(lang, side) {
            if (isRec || isProcessing) return;
            isRec = true; currentTranscript = ''; curLang = lang;
            setUIState('LISTENING');
            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            textDisplay.innerText = "Listening...";
            if (recognition) {
                recognition.lang = curLang;
                try { recognition.start(); } catch(e) {}
            }
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false; isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('THINKING');
            if (recognition) { try { recognition.stop(); } catch(e) {} }

            setTimeout(async () => {
                if (currentTranscript) {
                    try {
                        const isMM = curLang.startsWith('my');
                        const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(currentTranscript)}`);
                        const data = await res.json();
                        const result = data[0].map(s => s[0]).join('').trim();
                        textDisplay.innerText = result;
                        await speak(result, tl);
                    } catch (e) { log("Pipeline Fail"); hardReset(); }
                } else { hardReset(); }
            }, 400);
        }

        async function speak(text, lang) {
            setUIState('SPEAKING');
            const natural = document.getElementById('naturalSw').checked;
            
            if (natural) {
                try {
                    log("Fluent Nilar Synthesis...");
                    const EdgeClass = window.EdgeTTS || (window.EdgeTTS && window.EdgeTTS.EdgeTTS);
                    const tts = new EdgeClass();
                    const voice = (lang === 'my') ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                    
                    const audioData = await tts.synthesize(text, voice);
                    const blob = new Blob([audioData], { type: 'audio/mpeg' });
                    const url = URL.createObjectURL(blob);
                    
                    masterAudio.src = url;
                    masterAudio.onended = () => { 
                        URL.revokeObjectURL(url); 
                        finishTurn();
                    };
                    masterAudio.onerror = () => { throw new Error("Audio Error"); };
                    await masterAudio.play();
                    return;
                } catch (e) {
                    log("Neural Fail -> Google");
                }

                try {
                    const gLang = (lang === 'my') ? 'my' : 'en';
                    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${gLang}&client=tw-ob`;
                    masterAudio.src = url;
                    masterAudio.onended = () => finishTurn();
                    masterAudio.onerror = () => fallbackSpeak(text, lang);
                    await masterAudio.play();
                    return;
                } catch (e) { log("Engine Crash"); }
            }
            fallbackSpeak(text, lang);
        }

        function finishTurn() {
            const isCont = document.getElementById('contSw').checked;
            if (isCont) {
                isProcessing = false;
                // Switch language for the loop
                const nextLang = (curLang === 'my-MM') ? 'en-US' : 'my-MM';
                const nextSide = (nextLang === 'my-MM') ? 'left' : 'right';
                setTimeout(() => start(nextLang, nextSide), 800);
            } else {
                isProcessing = false;
                setUIState('READY');
            }
        }

        function fallbackSpeak(text, lang) {
            log("System Voice");
            const u = new SpeechSynthesisUtterance(text);
            u.lang = (lang === 'my') ? 'my-MM' : 'en-US';
            u.onend = () => finishTurn();
            window.speechSynthesis.speak(u);
        }

        async function testVoice() {
            log("Testing Nilar...");
            await speak("မင်္ဂလာပါ၊ ကျွန်မနာမည် နီလာ ဖြစ်ပါတယ်။ အခု အသံစနစ်က ပိုမို သဘာဝကျပြီး တည်ငြိမ်လာပါပြီ။", 'my');
        }

        function unlockAudio() {
            log("Audio System Live");
            masterAudio.play().then(() => { masterAudio.pause(); }).catch(() => {});
            if (window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            window.removeEventListener('pointerdown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('click', (e) => { 
                if (isProcessing) return;
                if (isRec) stopRecording();
                else start(lang, side); 
            });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        document.getElementById('themeSw').addEventListener('change', () => document.body.classList.toggle('dark-mode'));
        
        initSystem();
    </script>
</body>
</html>
