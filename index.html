<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike - Minimal AI Translator</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <!-- GOLDEN ERA LIBRARY: The exact version that worked -->
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body class="dark-mode">
    <div id="error-toast" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(255,0,0,0.8); color:white; padding:10px 20px; border-radius:20px; font-size:12px; z-index:1000; display:none;"></div>

    <div class="top-nav">
        <div class="nav-dot" id="navDot"></div>
        <span class="perm-status" id="permStatus">OFF</span>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="premium-menu-item">PREMIUM</button>
        <div class="menu-item">
            <span>DARK MODE</span>
            <label class="switch small-switch">
                <input type="checkbox" id="themeSwitch" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="menu-item">
            <span>NATURAL MODE</span>
            <label class="switch small-switch">
                <input type="checkbox" id="naturalSwitch" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="menu-item">
            <span>SHOW TEXT</span>
            <label class="switch small-switch">
                <input type="checkbox" id="showTextSwitch" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="speaker-wrapper" id="speakerWrapper">
        <div class="text-display-area" id="transcription"></div>
        
        <div class="status-area">
            <div class="horizontal-waves" id="hWaves">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div class="processing-loader" id="pLoader">
                <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
            </div>
        </div>

        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn left" id="btnMM">
                <span class="btn-label">MM</span>
            </button>
            <button class="half-btn right" id="btnENG">
                <span class="btn-label">ENG</span>
            </button>
        </div>
    </div>

    <script>
        const btnMM = document.getElementById('btnMM'), btnENG = document.getElementById('btnENG');
        const speakerWrapper = document.getElementById('speakerWrapper'), hWaves = document.getElementById('hWaves'), pLoader = document.getElementById('pLoader');
        const masterAudio = new Audio(); // <--- ADD THIS LINE OR THE APP WILL CRASH
        const transcription = document.getElementById('transcription'), errorToast = document.getElementById('error-toast');
        const permStatus = document.getElementById('permStatus'), navDot = document.getElementById('navDot'), dropdownMenu = document.getElementById('dropdownMenu');
        const themeSwitch = document.getElementById('themeSwitch'), naturalSwitch = document.getElementById('naturalSwitch'), showTextSwitch = document.getElementById('showTextSwitch');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null, isRecording = false, isTransitioning = false, finalBuffer = '', interimBuffer = '', isMicEnabled = false;
        let currentMicLang = 'en-US';

        function showError(msg) {
            errorToast.textContent = msg;
            errorToast.style.display = 'block';
            setTimeout(() => { errorToast.style.display = 'none'; }, 3000);
        }

        const getApiKey = () => (window.ENV?.GEMINI_API_KEY && !window.ENV.GEMINI_API_KEY.includes("REPLACE_")) ? window.ENV.GEMINI_API_KEY : "";

        // UI Interactions
        navDot.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('active'); });
        document.addEventListener('click', (e) => { if (!navDot.contains(e.target)) dropdownMenu.classList.remove('active'); });
        themeSwitch.addEventListener('change', () => { document.body.classList.toggle('dark-mode', themeSwitch.checked); localStorage.setItem('themePref', themeSwitch.checked ? 'dark' : 'light'); });
        naturalSwitch.addEventListener('change', () => { localStorage.setItem('naturalModePref', naturalSwitch.checked); });
        showTextSwitch.addEventListener('change', () => { localStorage.setItem('showTextPref', showTextSwitch.checked); transcription.classList.toggle('hidden', !showTextSwitch.checked); });

        permStatus.addEventListener('click', async (e) => { e.stopPropagation(); if (isTransitioning) return; if (isMicEnabled) disableMic(); else await requestMicAccess(); });

        function disableMic() {
            isRecording = false; 
            if (recognition) { try { recognition.onend = null; recognition.stop(); } catch(e){} }
            if (window.localStream) { window.localStream.getTracks().forEach(t => t.stop()); window.localStream = null; }
            localStorage.removeItem('micPermissionPref'); updateSwitch('denied');
        }

        function checkPermission() {
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'microphone' }).then(res => {
                        updateSwitch(res.state);
                        res.onchange = () => updateSwitch(res.state);
                    }).catch(() => {});
                } else if (localStorage.getItem('micPermissionPref') === 'true') {
                    updateSwitch('granted');
                }
            } catch (e) {}
        }

        if (localStorage.getItem('themePref') === 'light') { document.body.classList.remove('dark-mode'); themeSwitch.checked = false; }
        naturalSwitch.checked = localStorage.getItem('naturalModePref') !== 'false';
        showTextSwitch.checked = localStorage.getItem('showTextPref') !== 'false';
        transcription.classList.toggle('hidden', !showTextSwitch.checked);

        function updateSwitch(state) { 
            isMicEnabled = state === 'granted'; 
            permStatus.textContent = isMicEnabled ? 'ON' : 'OFF'; 
            permStatus.classList.toggle('active', isMicEnabled); 
        }

        async function requestMicAccess() { 
            try { 
                const s = await navigator.mediaDevices.getUserMedia({ audio: true }); 
                window.localStream = s; 
                localStorage.setItem('micPermissionPref', 'true');
                updateSwitch('granted'); 
                initRecognition(); 
                return true; 
            } catch(e) { showError("Mic access denied"); updateSwitch('denied'); return false; } 
        }

        // --- ENGINES ---
        async function translateNormal(text, sl, tl) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                return data[0].map(s => s[0]).join('').trim();
            } catch (e) { return null; }
        }

        async function processWithGemini(text, sl, tl) {
            const apiKey = getApiKey();
            if (!apiKey) return null;
            try {
                const prompt = `Translate ${sl==='my'?'Burmese':'English'} to ${tl==='my'?'Burmese':'English'} naturally. Output ONLY valid JSON: {"refined":"...", "translated":"..."}. Text: ${text}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
                return JSON.parse(jsonText);
            } catch (e) { return null; }
        }

        async function playAudio(url) {
            return new Promise((resolve) => {
                // REUSE THE UNLOCKED SPEAKER!
                masterAudio.src = url;
                
                masterAudio.onended = () => { 
                    if (url.startsWith('blob:')) URL.revokeObjectURL(url);
                    resolve(); 
                };
                masterAudio.onerror = (e) => { 
                    console.error("Audio Playback Error:", e);
                    resolve(); 
                };
                
                // Force play (it's already unlocked by the button click)
                masterAudio.play().catch(e => {
                    console.error("Play prevented:", e);
                    resolve();
                });
            });
        }

        async function speakLogic(text, targetLang, natural) {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            const apiKey = getApiKey();

            // 1. GEMINI NATURAL AUDIO
            if (natural && apiKey) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: `Speak naturally in ${targetLang==='my'?'Burmese':'English'}: ${text}` }] }],
                            generationConfig: { responseMimeType: "audio/wav" } 
                        })
                    });
                    const data = await response.json();
                    const b64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    if (b64) {
                        const blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        await playAudio(url);
                        return;
                    }
                } catch (e) { console.warn("Gemini TTS Fail", e); }
            }

            // 2. EDGE NEURAL TTS (Restoring the Golden Configuration)
            const segments = [];
            const regex = /([\u1000-\u109F\s.,!?'"()\-]+)|([a-zA-Z0-9\s.,!?'"()\-]+)/g;
            let m;
            while ((m = regex.exec(text)) !== null) {
                if (m[1]?.trim()) segments.push({ t: m[1].trim(), l: 'my' });
                else if (m[2]?.trim()) segments.push({ t: m[2].trim(), l: 'en' });
            }
            if (segments.length === 0) segments.push({ t: text.trim(), l: targetLang });

            try {
                // Check for the library object
                if (typeof EdgeTTS !== 'undefined' && EdgeTTS.EdgeTTS) {
                    const tts = new EdgeTTS.EdgeTTS();
                    for (const seg of segments) {
                        const voice = seg.l === 'my' ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                        // Using the specific ttsPromise method from the Golden Era version
                        const audioData = await tts.ttsPromise(seg.t, voice);
                        const blob = new Blob([audioData], { type: 'audio/mpeg' });
                        const url = URL.createObjectURL(blob);
                        await playAudio(url);
                    }
                    return;
                }
            } catch (e) {
                console.warn("EdgeTTS error:", e);
            }

            // 3. FALLBACK
            for (const seg of segments) {
                const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${seg.l}&client=tw-ob&q=${encodeURIComponent(seg.t)}`;
                await playAudio(url);
            }
        }

        // --- RECOGNITION ---
        function initRecognition() {
            if (recognition) return;
            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true;

            recognition.onresult = (e) => {
                let inter = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const res = e.results[i];
                    if (res.isFinal) finalBuffer += res[0].transcript + ' ';
                    else inter += res[0].transcript;
                }
                interimBuffer = inter;
                if (showTextSwitch.checked) {
                    let line = transcription.querySelector('.live-line') || (transcription.innerHTML = '<div class="live-line"></div>', transcription.querySelector('.live-line'));
                    line.textContent = finalBuffer + interimBuffer;
                }
            };

            recognition.onstart = () => { isRecording = true; isTransitioning = false; };
            recognition.onerror = () => { isRecording = false; isTransitioning = false; updateUIState('ready'); };
            recognition.onend = () => { if (isRecording) { try { recognition.start(); } catch(e){} } };
        }

        function renderFinalRoll(sub, main) {
            if (!showTextSwitch.checked) return;
            transcription.innerHTML = `<div class="roll-line"><div class="source-subtext">${sub}</div><div class="translation-main">${main}</div></div>`;
        }

        function updateUIState(state, side = '') {
            hWaves.classList.toggle('active', state === 'listening' && !showTextSwitch.checked);
            pLoader.classList.toggle('active', state === 'processing');
            speakerWrapper.className = state === 'listening' ? (side === 'my-MM' ? 'speaker-wrapper is-active-left' : 'speaker-wrapper is-active-right') : 'speaker-wrapper';
        }

        function startRecording(lang) {
            if (isTransitioning || isRecording || !isMicEnabled) return;
            isTransitioning = true; finalBuffer = ''; interimBuffer = ''; currentMicLang = lang;
            initRecognition();
            try { recognition.lang = lang; recognition.start(); updateUIState('listening', lang); } 
            catch (e) { isTransitioning = isRecording = false; updateUIState('ready'); }
        }

        async function stopRecording() {
            if (isTransitioning || !isRecording) return;

            // --- THE FIX: INSTANT UNLOCK ---
            // We play silence IMMEDIATELY to keep the speaker alive
            masterAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABBTZGF0YQQAAAAAAAAAAAA=";
            masterAudio.play().catch(e => console.log("Audio unlock failed", e));
            // -------------------------------

            isRecording = false; isTransitioning = true; updateUIState('processing');
            if (recognition) { recognition.onend = null; try { recognition.stop(); } catch(e){} }

            setTimeout(async () => {
                const rawText = (finalBuffer + interimBuffer).trim();
                if (rawText) {
                    // Logic: MM button = Burmese Input -> English Output
                    const isBurmeseIn = currentMicLang === 'my-MM';
                    const sl = isBurmeseIn ? 'my' : 'en';
                    const tl = isBurmeseIn ? 'en' : 'my';
                    
                    const inputDisplay = sl === 'en' ? refineEnglish(rawText) : rawText;
                    const translated = (naturalSwitch.checked && getApiKey()) ? await processWithGemini(rawText, sl, tl) : await translateNormal(inputDisplay, sl, tl);

                    if (translated) {
                        const fSub = (typeof translated === 'object') ? translated.refined : inputDisplay;
                        const fMain = (typeof translated === 'object') ? translated.translated : translated;
                        renderFinalRoll(fSub, fMain);
                        // Trigger TTS immediately on result
                        await speakLogic(fMain, tl, naturalSwitch.checked);
                    }
                }
                updateUIState('ready'); isTransitioning = false;
            }, 800);
        }

        function refineEnglish(t) {
            let r = t.trim().charAt(0).toUpperCase() + t.trim().slice(1);
            const c = [[/\b(i)\b/g, "I"], [/\b(im)\b/gi, "I'm"], [/\b(dont)\b/gi, "don't"], [/\b(cant)\b/gi, "can't"], [/\b(youre)\b/gi, "you're"], [/\b(its)\b/gi, "it's"]];
            c.forEach(([reg, val]) => { r = r.replace(reg, val); }); return r.replace(/\s+/g, " ");
        }

        btnMM.addEventListener('click', (e) => { e.preventDefault(); if (!isTransitioning) isRecording ? stopRecording() : startRecording('my-MM'); });
        btnENG.addEventListener('click', (e) => { e.preventDefault(); if (!isTransitioning) isRecording ? stopRecording() : startRecording('en-US'); });
        (async () => { if (localStorage.getItem('micPermissionPref') === 'true') await requestMicAccess(); checkPermission(); })();
    </script>
</body>
</html>
