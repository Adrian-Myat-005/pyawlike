<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike - Golden Native AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body class="dark-mode">
    <div id="error-toast" style="position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(255,50,50,0.9); color:white; padding:12px 24px; border-radius:30px; font-size:14px; z-index:2000; display:none; font-weight:bold; box-shadow: 0 5px 20px rgba(0,0,0,0.3);"></div>

    <div class="top-nav">
        <div class="nav-dot" id="navDot"></div>
        <span class="perm-status" id="permStatus">OFF</span>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="premium-menu-item">PREMIUM</button>
        <div class="menu-item">
            <span>NATURAL MODE</span>
            <label class="switch small-switch"><input type="checkbox" id="naturalSwitch" checked><span class="slider"></span></label>
        </div>
        <div class="menu-item">
            <span>SHOW TEXT</span>
            <label class="switch small-switch"><input type="checkbox" id="showTextSwitch" checked><span class="slider"></span></label>
        </div>
    </div>

    <div class="speaker-wrapper" id="speakerWrapper">
        <div class="text-display-area" id="transcription"></div>
        <div class="status-area">
            <div class="horizontal-waves" id="hWaves"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
            <div class="processing-loader" id="pLoader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
        </div>
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn left" id="btnMM"><span class="btn-label">MM</span></button>
            <button class="half-btn right" id="btnENG"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        // --- SETUP ---
        const btnMM = document.getElementById('btnMM'), btnENG = document.getElementById('btnENG');
        const speakerWrapper = document.getElementById('speakerWrapper'), hWaves = document.getElementById('hWaves'), pLoader = document.getElementById('pLoader');
        const transcription = document.getElementById('transcription'), errorToast = document.getElementById('error-toast');
        const permStatus = document.getElementById('permStatus');
        
        // REUSABLE AUDIO PLAYER
        const masterAudio = new Audio();
        
        let isRecording = false, isTransitioning = false, finalBuffer = '', currentMicLang = 'en-US';
        const NativeSpeech = window.Capacitor ? Capacitor.Plugins.SpeechRecognition : null;

        function showError(msg) {
            errorToast.textContent = msg; errorToast.style.display = 'block';
            setTimeout(() => { errorToast.style.display = 'none'; }, 4000);
        }

        async function requestMicAccess() {
            if (NativeSpeech) {
                try {
                    const status = await NativeSpeech.requestPermissions();
                    updateSwitch(status.speechRecognition === 'granted' || status.microphone === 'granted');
                } catch (e) { console.error(e); }
            } else {
                try { await navigator.mediaDevices.getUserMedia({ audio: true }); updateSwitch(true); } catch(e){ updateSwitch(false); }
            }
        }
        function updateSwitch(active) { permStatus.textContent = active ? 'ON' : 'OFF'; permStatus.classList.toggle('active', active); }

        // --- 🧠 THE BRAIN: TRANSLATION ---
        async function processTranslation(text) {
            if (!text || text.trim().length < 1) return;
            const isBurmeseIn = currentMicLang === 'my-MM';
            const sl = isBurmeseIn ? 'my' : 'en';
            const tl = isBurmeseIn ? 'en' : 'my';
            
            // 1. Natural Mode (Gemini)
            if (document.getElementById('naturalSwitch').checked) {
                try {
                    const apiKey = window.ENV?.GEMINI_API_KEY;
                    if (!apiKey) throw new Error("No API Key");

                    const prompt = `Translate this ${sl==='my'?'Burmese':'English'} text to ${tl==='my'?'Burmese':'English'} naturally. Input: "${text}". Return ONLY raw JSON: {"refined":"(corrected input)", "translated":"(natural translation)"}`;

                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await resp.json();
                    const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
                    const result = JSON.parse(jsonText);

                    updateDisplay(result.refined, result.translated);
                    await speakNatural(result.translated, tl);
                    return;
                } catch (e) { console.log("Gemini Fail, Fallback"); }
            }

            // 2. Standard Mode (Free Google)
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                const translated = data[0].map(s => s[0]).join('').trim();
                
                updateDisplay(text, translated);
                await speakStandard(translated, tl);
            } catch (e) { showError("Net Error"); resetUI(); }
        }

        // --- 🗣️ THE VOICE: TTS ---
        async function speakNatural(text, lang) {
            try {
                const apiKey = window.ENV?.GEMINI_API_KEY;
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: `Speak naturally in ${lang==='my'?'Burmese':'English'}: ${text}` }] }],
                        generationConfig: { responseMimeType: "audio/wav" } 
                    })
                });
                const data = await resp.json();
                const b64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (b64) {
                    const blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    masterAudio.src = url;
                    masterAudio.play();
                } else { await speakStandard(text, lang); }
            } catch (e) { await speakStandard(text, lang); }
        }

        async function speakStandard(text, lang) {
            // 1. Try Native Android TTS (Best Free/Offline)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'my' ? 'my-MM' : 'en-US';
                // Android "Speech Services by Google" provides high quality here
                window.speechSynthesis.speak(utterance);
                return;
            }
            // 2. Fallback to Google Network TTS
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(text)}`;
            masterAudio.src = url; masterAudio.play();
        }

        // --- RECORDING ---
        async function startRecording(lang) {
            if (isTransitioning || isRecording) return;
            isTransitioning = true; finalBuffer = ''; currentMicLang = lang;
            updateUIState('listening', lang);

            if (NativeSpeech) {
                try {
                    await NativeSpeech.start({ language: lang, maxResults: 1, partialResults: true, popup: false });
                    isRecording = true; isTransitioning = false;
                    NativeSpeech.addListener('partialResults', (data) => {
                        if (data.matches && data.matches.length > 0) updateLiveText(data.matches[0]);
                    });
                } catch (e) { showError("Mic Error"); resetUI(); }
            } else {
                initBrowserRecognition(lang);
            }
        }

        async function stopRecording() {
            if (!isRecording) return;
            // Silent Unlock
            masterAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABBTZGF0YQQAAAAAAAAAAAA=";
            masterAudio.play().catch(()=>{});

            isRecording = false; isTransitioning = true; updateUIState('processing');

            if (NativeSpeech) { try { await NativeSpeech.stop(); NativeSpeech.removeAllListeners(); } catch(e){} }
            else if (window.browserRecognition) window.browserRecognition.stop();

            setTimeout(() => {
                if (finalBuffer.trim()) processTranslation(finalBuffer);
                else resetUI();
            }, 800);
        }

        // --- HELPERS ---
        function updateDisplay(sub, main) { transcription.innerHTML = `<div class="roll-line"><div class="source-subtext">${sub}</div><div class="translation-main">${main}</div></div>`; resetUI(); }
        function updateLiveText(t) { finalBuffer = t; if(document.getElementById('showTextSwitch').checked) transcription.innerHTML = `<div class="live-line">${t}</div>`; }
        function updateUIState(s, l) { hWaves.classList.toggle('active', s==='listening'); pLoader.classList.toggle('active', s==='processing'); speakerWrapper.className = s==='listening'?(l==='my-MM'?'speaker-wrapper is-active-left':'speaker-wrapper is-active-right'):'speaker-wrapper'; }
        function resetUI() { isRecording=false; isTransitioning=false; updateUIState('ready'); }
        btnMM.addEventListener('mousedown', (e) => { e.preventDefault(); if(!isTransitioning) isRecording ? stopRecording() : startRecording('my-MM'); });
        btnENG.addEventListener('mousedown', (e) => { e.preventDefault(); if(!isTransitioning) isRecording ? stopRecording() : startRecording('en-US'); });
        document.getElementById('navDot').addEventListener('click', (e)=>{e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('active');});
        document.addEventListener('click', (e)=>{if(!document.getElementById('navDot').contains(e.target)) document.getElementById('dropdownMenu').classList.remove('active');});
        (async()=>{ await requestMicAccess(); })();
        function initBrowserRecognition(lang) { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return; const br = new SR(); window.browserRecognition = br; br.continuous=true; br.interimResults=true; br.lang=lang; br.onstart=()=>{isRecording=true; isTransitioning=false;}; br.onresult=(e)=>{let t=''; for(let i=e.resultIndex; i<e.results.length; ++i) t+=e.results[i][0].transcript; updateLiveText(t);}; br.start(); }
    </script>
</body>
</html>
