<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Minimal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body>
    <div class="top-nav-container">
        <button class="fs-btn" onclick="toggleFS()">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <div class="nav-dot" id="menuBtn"></div>
    </div>

    <div class="dropdown" id="menu">
        <div class="menu-item">FULLSCREEN <button onclick="toggleFS()" style="background:none;border:1px solid var(--accent);border-radius:4px;font-size:9px;padding:2px 6px;color:var(--text);">TOGGLE</button></div>
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">TEXT DISPLAY <input type="checkbox" id="textSw" checked></div>
    </div>

    <div class="status-area" id="statusBox">
        <div class="transcription" id="textDisplay">READY</div>
    </div>

    <div class="wave-container" id="waveBox">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const textDisplay = document.getElementById('textDisplay');
        const statusBox = document.getElementById('statusBox');
        const waveBox = document.getElementById('waveBox');
        const textSw = document.getElementById('textSw');
        let masterAudio = new Audio();
        
        let isRec = false, isProcessing = false, curLang = 'en-US', currentTranscript = '';
        let recognition = null;

        function setUIState(active) {
            if (active) {
                if (textSw.checked) {
                    statusBox.style.display = 'flex';
                    waveBox.style.display = 'none';
                } else {
                    statusBox.style.display = 'none';
                    waveBox.style.display = 'flex';
                }
            } else {
                if (textSw.checked) {
                    statusBox.style.display = 'flex';
                    waveBox.style.display = 'none';
                } else {
                    statusBox.style.display = 'none';
                    waveBox.style.display = 'none';
                }
            }
        }

        async function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        }

        async function hardReset() {
            isRec = false; isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            setUIState(false);
            textDisplay.innerText = "READY";
            masterAudio.pause();
            if (recognition) { try { recognition.stop(); } catch(e) {} }
        }

        async function initSystem() {
            if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
                const SpeechReq = window.webkitSpeechRecognition || window.speechRecognition;
                recognition = new SpeechReq();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let full = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) full += e.results[i][0].transcript;
                    currentTranscript = full.trim();
                    textDisplay.innerText = currentTranscript || "...";
                };
                recognition.onend = () => { if (isRec) try { recognition.start(); } catch(e) {} };
            }
        }

        async function start(lang, side) {
            if (isRec || isProcessing) return;
            isRec = true; currentTranscript = ''; curLang = lang;
            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            setUIState(true);
            textDisplay.innerText = "Listening...";
            if (recognition) {
                recognition.lang = curLang;
                try { recognition.start(); } catch(e) {}
            }
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false; isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            if (recognition) { try { recognition.stop(); } catch(e) {} }

            setTimeout(async () => {
                if (currentTranscript) {
                    try {
                        const isMM = curLang.startsWith('my');
                        const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(currentTranscript)}`);
                        const data = await res.json();
                        const result = data[0].map(s => s[0]).join('').trim();
                        textDisplay.innerText = result;
                        await speak(result, tl);
                    } catch (e) { hardReset(); }
                } else { hardReset(); }
            }, 400);
        }

        async function speak(text, lang) {
            try {
                const TTS = window.EdgeTTS?.EdgeTTS || window.EdgeTTS;
                const tts = new TTS();
                const voice = (lang === 'my' || lang === 'my-MM') ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                const audioData = await tts.synthesize(text, voice);
                const blob = new Blob([audioData], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                masterAudio.src = url;
                masterAudio.onended = () => { URL.revokeObjectURL(url); hardReset(); };
                await masterAudio.play();
            } catch (e) { hardReset(); }
        }

        function unlockAudio() {
            masterAudio.play().then(() => { masterAudio.pause(); }).catch(()=>{});
            window.removeEventListener('pointerdown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('click', () => { 
                if (isProcessing) return;
                if (isRec) stopRecording();
                else start(lang, side); 
            });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        document.getElementById('themeSw').addEventListener('change', () => document.body.classList.toggle('dark-mode'));
        textSw.addEventListener('change', () => setUIState(isRec || isProcessing));
        
        initSystem();
    </script>
</body>
</html>
