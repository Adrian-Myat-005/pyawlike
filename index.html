<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Bulletproof</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="config.js"></script>
    <style>
        :root { --circle-size: clamp(220px, 50vw, 300px); }
        body { background: var(--bg); transition: 0.3s; overflow: hidden; }
        .status-area {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            width: 90vw; max-width: 500px; min-height: 140px;
            background: rgba(255, 255, 255, 0.95); border-radius: 32px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); z-index: 10000;
        }
        .transcription { font-size: 26px; font-weight: 800; color: #333; text-align: center; line-height: 1.3; }
        .status-badge { font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; }
        .speaker-wrapper { position: fixed; bottom: 12%; left: 50%; transform: translateX(-50%); z-index: 1000; }
        .error-msg { color: red; font-size: 10px; margin-top: 5px; font-weight: 700; }
    </style>
</head>
<body class="">
    <div id="debug-log" style="position:fixed;top:10px;left:10px;right:10px;max-height:40px;background:rgba(0,0,0,0.05);color:var(--text);font-family:monospace;font-size:10px;padding:5px;overflow:hidden;z-index:100000;border-radius:5px;opacity:0.6;">System Secure</div>
    
    <div class="top-nav" id="menuBtn"><div class="nav-dot"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">CONTINUOUS <input type="checkbox" id="contSw"></div>
        <button onclick="testVoice()" style="background:var(--accent);color:white;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;margin-top:10px;cursor:pointer;font-size:12px;">TEST GOOGLE VOICE</button>
        <button onclick="hardReset()" style="background:#ff4444;color:white;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;margin-top:15px;cursor:pointer;font-size:12px;">FORCE RESTART</button>
    </div>

    <div class="status-area">
        <div class="status-badge" id="stateBadge">READY</div>
        <div class="transcription" id="textDisplay">TAP TO START</div>
        <div class="error-msg" id="errorDisplay"></div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('debug-log');
        const textDisplay = document.getElementById('textDisplay');
        const stateBadge = document.getElementById('stateBadge');
        const errorDisplay = document.getElementById('errorDisplay');
        let masterAudio = new Audio();
        
        let isRec = false, isProcessing = false;
        let curLang = 'en-US', currentTranscript = '';
        let recognition = null;

        function log(msg) { logArea.innerText = msg; console.log(msg); }
        function setUIState(state) { stateBadge.innerText = state; }

        async function hardReset() {
            isRec = false; isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('READY');
            textDisplay.innerText = "READY";
            errorDisplay.innerText = "";
            masterAudio.pause();
            masterAudio.currentTime = 0;
            if (recognition) { try { recognition.stop(); } catch(e) {} }
        }

        // --- CORE: BULLETPROOF GOOGLE FETCH ---
        async function playGoogleTTS(text, lang) {
            return new Promise(async (resolve, reject) => {
                try {
                    const gLang = (lang === 'my' || lang === 'my-MM') ? 'my' : 'en';
                    // Using the hidden high-quality endpoint
                    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${gLang}&client=tw-ob`;
                    
                    // FETCH AS BLOB to bypass browser security blocks
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Network Block");
                    const blob = await response.blob();
                    const audioUrl = URL.createObjectURL(blob);

                    masterAudio.src = audioUrl;
                    masterAudio.onended = () => {
                        URL.revokeObjectURL(audioUrl);
                        resolve();
                    };
                    masterAudio.onerror = (e) => reject(e);
                    await masterAudio.play();
                } catch (e) {
                    reject(e);
                }
            });
        }

        async function initSystem() {
            if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
                const SpeechReq = window.webkitSpeechRecognition || window.speechRecognition;
                recognition = new SpeechReq();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let full = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) full += e.results[i][0].transcript;
                    currentTranscript = full.trim();
                    textDisplay.innerText = currentTranscript || "Listening...";
                };
                recognition.onend = () => { if (isRec) try { recognition.start(); } catch(e) {} };
                log("System Live");
            } else { errorDisplay.innerText = "No Mic Found"; }
        }

        async function start(lang, side) {
            if (isRec || isProcessing) return;
            // AUDIO TRICK: Play silence to unlock Android Audio Channel
            masterAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            masterAudio.play().catch(()=>{});

            isRec = true; currentTranscript = ''; curLang = lang;
            setUIState('LISTENING');
            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            textDisplay.innerText = "Listening...";
            if (recognition) {
                recognition.lang = curLang;
                try { recognition.start(); } catch(e) {}
            }
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false; isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('THINKING');
            if (recognition) { try { recognition.stop(); } catch(e) {} }

            setTimeout(async () => {
                if (currentTranscript) {
                    try {
                        const isMM = curLang.startsWith('my');
                        const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(currentTranscript)}`);
                        const data = await res.json();
                        const result = data[0].map(s => s[0]).join('').trim();
                        textDisplay.innerText = result;
                        
                        setUIState('SPEAKING');
                        await playGoogleTTS(result, tl);
                        finishTurn();
                    } catch (e) { 
                        errorDisplay.innerText = "Net/Audio Error"; 
                        setTimeout(hardReset, 2000); 
                    }
                } else { hardReset(); }
            }, 400);
        }

        function finishTurn() {
            const isCont = document.getElementById('contSw').checked;
            if (isCont) {
                isProcessing = false;
                const nextLang = (curLang === 'my-MM') ? 'en-US' : 'my-MM';
                const nextSide = (nextLang === 'my-MM') ? 'left' : 'right';
                setTimeout(() => start(nextLang, nextSide), 600);
            } else {
                hardReset();
            }
        }

        async function testVoice() {
            log("Testing...");
            try {
                await playGoogleTTS("မင်္ဂလာပါ၊ အသံ ကြားရပြီလား။", 'my');
                log("Success");
            } catch(e) {
                errorDisplay.innerText = "Voice Blocked: " + e.message;
            }
        }

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('click', (e) => { 
                if (isProcessing) return;
                if (isRec) stopRecording();
                else start(lang, side); 
            });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        document.getElementById('themeSw').addEventListener('change', () => document.body.classList.toggle('dark-mode'));
        
        initSystem();
    </script>
</body>
</html>
