<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike - Golden Native AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <!-- THE PROVEN QUALITY: Stable Edge TTS Universal -->
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal@latest/dist/index.min.js"></script>
</head>
<body class="dark-mode">
    <div id="error-toast" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(255,0,0,0.8); color:white; padding:10px 20px; border-radius:20px; font-size:12px; z-index:1000; display:none;"></div>

    <div class="top-nav">
        <div class="nav-dot" id="navDot"></div>
        <span class="perm-status" id="permStatus">OFF</span>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="premium-menu-item">PREMIUM</button>
        <div class="menu-item">
            <span>DARK MODE</span>
            <label class="switch small-switch">
                <input type="checkbox" id="themeSwitch" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="menu-item">
            <span>NATURAL MODE</span>
            <label class="switch small-switch">
                <input type="checkbox" id="naturalSwitch" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="menu-item">
            <span>SHOW TEXT</span>
            <label class="switch small-switch">
                <input type="checkbox" id="showTextSwitch" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="speaker-wrapper" id="speakerWrapper">
        <div class="text-display-area" id="transcription"></div>
        
        <div class="status-area">
            <div class="horizontal-waves" id="hWaves">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div class="processing-loader" id="pLoader">
                <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
            </div>
        </div>

        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn left" id="btnMM">
                <span class="btn-label">MM</span>
            </button>
            <button class="half-btn right" id="btnENG">
                <span class="btn-label">ENG</span>
            </button>
        </div>
    </div>

    <script>
        const btnMM = document.getElementById('btnMM'), btnENG = document.getElementById('btnENG');
        const speakerWrapper = document.getElementById('speakerWrapper'), hWaves = document.getElementById('hWaves'), pLoader = document.getElementById('pLoader');
        const transcription = document.getElementById('transcription'), errorToast = document.getElementById('error-toast');
        const permStatus = document.getElementById('permStatus'), navDot = document.getElementById('navDot'), dropdownMenu = document.getElementById('dropdownMenu');
        const themeSwitch = document.getElementById('themeSwitch'), naturalSwitch = document.getElementById('naturalSwitch'), showTextSwitch = document.getElementById('showTextSwitch');
        
        const masterAudio = new Audio();
        masterAudio.crossOrigin = "anonymous";
        
        let isRecording = false, isTransitioning = false, finalBuffer = '', currentMicLang = 'en-US';
        
        // --- NATIVE PLUGIN SETUP (The Bionic Ear) ---
        const NativeSpeech = window.Capacitor ? Capacitor.Plugins.SpeechRecognition : null;

        function showError(msg) {
            errorToast.textContent = msg;
            errorToast.style.display = 'block';
            setTimeout(() => { errorToast.style.display = 'none'; }, 3000);
        }

        async function requestMicAccess() {
            if (NativeSpeech) {
                try {
                    const status = await NativeSpeech.requestPermissions();
                    if (status.speechRecognition === 'granted' || status.microphone === 'granted') {
                        updateSwitch(true); return true;
                    }
                } catch (e) { console.error("Perm Error", e); }
            }
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                updateSwitch(true); return true;
            } catch(e) { updateSwitch(false); return false; }
        }

        function updateSwitch(active) {
            permStatus.textContent = active ? 'ON' : 'OFF';
            permStatus.classList.toggle('active', active);
        }

        const getApiKey = () => (window.ENV?.GEMINI_API_KEY && !window.ENV.GEMINI_API_KEY.includes("REPLACE_")) ? window.ENV.GEMINI_API_KEY : "";

        // --- GOLDEN ERA TRANSLATION ENGINES ---
        async function translateNormal(text, sl, tl) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                return data[0].map(s => s[0]).join('').trim();
            } catch (e) { return null; }
        }

        async function processWithGemini(text, sl, tl) {
            const apiKey = getApiKey();
            if (!apiKey) return null;
            try {
                const prompt = `Translate ${sl==='my'?'Burmese script':'English'} to ${tl==='my'?'Burmese script':'English'} naturally. JSON only: {"refined":"...", "translated":"..."}. Text: ${text}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
                return JSON.parse(jsonText);
            } catch (e) { return null; }
        }

        async function playAudio(url) {
            return new Promise((resolve) => {
                masterAudio.src = url;
                masterAudio.onended = resolve;
                masterAudio.onerror = resolve;
                masterAudio.play().catch(resolve);
            });
        }

        // --- GOLDEN ERA BLENDED TTS ---
        async function speakLogic(text, targetLang, natural) {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            const apiKey = getApiKey();

            // 1. Natural Mode (Gemini AI Audio)
            if (natural && apiKey) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: `Speak naturally in ${targetLang==='my'?'Burmese':'English'}: ${text}` }] }],
                            generationConfig: { responseMimeType: "audio/wav" } 
                        })
                    });
                    const data = await response.json();
                    const b64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    if (b64) {
                        const blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        await playAudio(url);
                        URL.revokeObjectURL(url);
                        return;
                    }
                } catch (e) {}
            }

            // 2. Blended Neural Era (Edge TTS - The "Quality One")
            const segments = [];
            const regex = /([\u1000-\u109F\s.,!?'"()\-]+)|([a-zA-Z0-9\s.,!?'"()\-]+)/g;
            let m;
            while ((m = regex.exec(text)) !== null) {
                if (m[1]?.trim()) segments.push({ t: m[1].trim(), l: 'my' });
                else if (m[2]?.trim()) segments.push({ t: m[2].trim(), l: 'en' });
            }
            if (segments.length === 0) segments.push({ t: text.trim(), l: targetLang });

            for (const seg of segments) {
                try {
                    const voice = seg.l === 'my' ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                    if (typeof EdgeTTS !== 'undefined' && EdgeTTS.EdgeTTS) {
                        const tts = new EdgeTTS.EdgeTTS();
                        const audioData = await tts.ttsPromise(seg.t, voice);
                        const blob = new Blob([audioData], { type: 'audio/mpeg' });
                        const url = URL.createObjectURL(blob);
                        await playAudio(url);
                        URL.revokeObjectURL(url);
                    } else { throw new Error(); }
                } catch (e) {
                    const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${seg.l}&client=tw-ob&q=${encodeURIComponent(seg.t)}`;
                    await playAudio(url);
                }
            }
        }

        // --- NATIVE RECOGNITION LOGIC ---
        async function startRecording(lang) {
            if (isTransitioning || isRecording) return;
            isTransitioning = true; finalBuffer = ''; currentMicLang = lang;
            updateUIState('listening', lang);

            if (NativeSpeech) {
                try {
                    await NativeSpeech.start({
                        language: lang,
                        maxResults: 2,
                        partialResults: true,
                        popup: false
                    });
                    isRecording = true;
                    isTransitioning = false;
                    NativeSpeech.addListener('partialResults', (data) => {
                        if (data.matches && data.matches.length > 0) updateLiveText(data.matches[0]);
                    });
                } catch (e) { showError("Native Mic Failed"); resetUI(); }
            } else {
                initBrowserRecognition(lang);
            }
        }

        async function stopRecording() {
            if (!isRecording) return;
            // Silent unlock trick
            masterAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABBTZGF0YQQAAAAAAAAAAAA=";
            masterAudio.play().catch(e => {});

            isRecording = false; isTransitioning = true; updateUIState('processing');

            if (NativeSpeech) {
                try { await NativeSpeech.stop(); NativeSpeech.removeAllListeners(); } catch (e) {}
            } else if (window.browserRecognition) {
                window.browserRecognition.stop();
            }

            setTimeout(async () => {
                if (finalBuffer.trim()) {
                    const sl = currentMicLang === 'my-MM' ? 'my' : 'en';
                    const tl = currentMicLang === 'my-MM' ? 'en' : 'my';
                    const inputDisplay = sl === 'en' ? (finalBuffer.trim().charAt(0).toUpperCase() + finalBuffer.trim().slice(1)) : finalBuffer;
                    
                    const translated = (naturalSwitch.checked && getApiKey()) ? await processWithGemini(finalBuffer, sl, tl) : await translateNormal(inputDisplay, sl, tl);

                    if (translated) {
                        const fSub = (typeof translated === 'object') ? translated.refined : inputDisplay;
                        const fMain = (typeof translated === 'object') ? translated.translated : translated;
                        transcription.innerHTML = `<div class="roll-line"><div class="source-subtext">${fSub}</div><div class="translation-main">${fMain}</div></div>`;
                        await speakLogic(fMain, tl, naturalSwitch.checked);
                    }
                }
                resetUI();
            }, 800);
        }

        function updateLiveText(text) {
            finalBuffer = text;
            if (showTextSwitch.checked) {
                transcription.innerHTML = `<div class="live-line">${text}</div>`;
                transcription.classList.remove('hidden');
            }
        }

        function initBrowserRecognition(lang) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) { showError("Browser not supported"); resetUI(); return; }
            const br = new SR();
            window.browserRecognition = br;
            br.continuous = true; br.interimResults = true; br.lang = lang;
            br.onstart = () => { isRecording = true; isTransitioning = false; };
            br.onresult = (e) => {
                let t = ''; for(let i = e.resultIndex; i < e.results.length; ++i) t += e.results[i][0].transcript;
                updateLiveText(t);
            };
            br.start();
        }

        function updateUIState(state, side = '') {
            hWaves.classList.toggle('active', state === 'listening' && !showTextSwitch.checked);
            pLoader.classList.toggle('active', state === 'processing');
            speakerWrapper.className = state === 'listening' ? (side === 'my-MM' ? 'speaker-wrapper is-active-left' : 'speaker-wrapper is-active-right') : 'speaker-wrapper';
        }

        function resetUI() { isRecording = false; isTransitioning = false; updateUIState('ready'); }

        // --- LISTENERS ---
        btnMM.addEventListener('mousedown', (e) => { e.preventDefault(); if (!isTransitioning) isRecording ? stopRecording() : startRecording('my-MM'); });
        btnENG.addEventListener('mousedown', (e) => { e.preventDefault(); if (!isTransitioning) isRecording ? stopRecording() : startRecording('en-US'); });
        navDot.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('active'); });
        document.addEventListener('click', (e) => { if (!navDot.contains(e.target)) dropdownMenu.classList.remove('active'); });
        
        (async () => { await requestMicAccess(); })();
    </script>
</body>
</html>
