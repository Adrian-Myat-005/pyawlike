<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Robust Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
    <style>
        :root { --circle-size: clamp(220px, 50vw, 300px); }
        .speaker-wrapper { width: var(--circle-size); height: var(--circle-size); }
        .status-area {
            position: fixed;
            top: 15vh;
            left: 50%;
            transform: translateX(-50%);
            width: 85vw;
            max-width: 450px;
            background: var(--btn-white);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 12px 12px 25px var(--shadow-dark), -12px -12px 25px var(--shadow-light);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .transcription { font-size: clamp(18px, 4vw, 24px); font-weight: 700; color: var(--text); text-align: center; width: 100%; }
        .status-badge { font-size: 10px; font-weight: 900; letter-spacing: 2px; margin-bottom: 12px; color: var(--accent); text-transform: uppercase; }
        body.active-left .status-area, body.active-right .status-area { transform: translateX(-50%) scale(1.03); border: 2px solid var(--accent); }
    </style>
</head>
<body class="">
    <div id="debug-log" style="position:fixed;top:10px;left:10px;right:10px;max-height:40px;background:rgba(0,0,0,0.05);color:var(--text);font-family:monospace;font-size:10px;padding:5px;overflow:hidden;z-index:10000;border-radius:5px;pointer-events:none;opacity:0.6;">System Stable</div>
    
    <div class="top-nav" id="menuBtn"><div class="nav-dot"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">NATURAL VOICE <input type="checkbox" id="naturalSw" checked></div>
        <div class="menu-item">CONTINUOUS <input type="checkbox" id="contSw"></div>
        <button onclick="testVoice()" style="background:var(--accent);color:white;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;margin-top:10px;cursor:pointer;font-size:12px;">TEST VOICE OUTPUT</button>
        <button onclick="hardReset()" style="background:#ff4444;color:white;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;margin-top:15px;cursor:pointer;font-size:12px;">HARD RESET SYSTEM</button>
    </div>

    <div class="status-area">
        <div class="status-badge" id="stateBadge">READY</div>
        <div class="transcription" id="textDisplay">READY</div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('debug-log');
        const textDisplay = document.getElementById('textDisplay');
        const stateBadge = document.getElementById('stateBadge');
        const masterAudio = new Audio();
        
        let isRec = false, isProcessing = false;
        let curLang = 'en-US', currentTranscript = '';
        
        const { Haptics, StatusBar, App, SpeechRecognition } = (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins : {};
        let recognition = null;

        function log(msg) { logArea.innerText = msg; console.log(msg); }
        function setUIState(state) { stateBadge.innerText = state; }

        async function hardReset() {
            isRec = false; isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('READY');
            textDisplay.innerText = "READY";
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            masterAudio.pause();
            if (SpeechRecognition) {
                try { await SpeechRecognition.stop(); } catch(e) {}
                SpeechRecognition.removeAllListeners();
            } else if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            const isCont = document.getElementById('contSw').checked;
            if (isCont) setTimeout(() => start(curLang, curLang === 'my-MM' ? 'left' : 'right'), 1000);
        }

        async function initSystem() {
            log("Initializing...");
            if (SpeechRecognition) {
                try {
                    const avail = await SpeechRecognition.available();
                    if (avail.available) {
                        await SpeechRecognition.requestPermissions();
                        log("Mic Ready");
                    }
                } catch (e) { log("Mic Error"); }
            } else if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
                log("Browser Mic Ready");
                const SpeechReq = window.webkitSpeechRecognition || window.speechRecognition;
                recognition = new SpeechReq();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let full = '';
                    for (let i = 0; i < e.results.length; ++i) full += e.results[i][0].transcript;
                    currentTranscript = full.trim();
                    if (document.getElementById('textSw').checked) textDisplay.innerText = currentTranscript || "Listening...";
                };
                recognition.onend = () => { if (isRec) try { recognition.start(); } catch(e) {} };
            }
        }

        async function start(lang, side) {
            if (isRec || isProcessing) return;
            if (Haptics) Haptics.impact({ style: 'MEDIUM' }).catch(()=>{});

            isRec = true; currentTranscript = ''; curLang = lang;
            setUIState('LISTENING');
            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            textDisplay.innerText = "Listening...";

            if (SpeechRecognition) {
                SpeechRecognition.removeAllListeners();
                SpeechRecognition.addListener('partialResults', (data) => {
                    if (data.matches && data.matches.length > 0) {
                        currentTranscript = data.matches[0];
                        if (document.getElementById('textSw').checked) textDisplay.innerText = currentTranscript;
                    }
                });
                try {
                    await SpeechRecognition.start({ language: curLang, partialResults: true, popup: false, continuous: true });
                } catch (e) { isRec = false; }
            } else if (recognition) {
                recognition.lang = curLang;
                try { recognition.start(); } catch(e) {}
            }
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false; isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('TRANSLATING');
            if (Haptics) Haptics.impact({ style: 'LIGHT' }).catch(()=>{});

            if (SpeechRecognition) try { await SpeechRecognition.stop(); } catch(e) {}
            else if (recognition) try { recognition.stop(); } catch(e) {}

            setTimeout(async () => {
                if (currentTranscript) await processPipeline(currentTranscript);
                else hardReset();
            }, 400);
        }

        async function processPipeline(text) {
            const isMM = curLang.startsWith('my');
            const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                // High-Speed Reliable Endpoint
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const result = data[0].map(s => s[0]).join('').trim();
                if (document.getElementById('textSw').checked) textDisplay.innerText = result;
                await speak(result, tl);
            } catch (e) { log("Trans Error"); hardReset(); }
        }

        async function speak(text, lang) {
            setUIState('SPEAKING');
            const natural = document.getElementById('naturalSw').checked;
            
            if (natural) {
                try {
                    log("Voice Output...");
                    const gLang = (lang === 'my') ? 'my' : 'en';
                    // Using the highly-reliable Google Proxy Engine for Android
                    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${gLang}&client=tw-ob`;
                    masterAudio.src = url;
                    masterAudio.onended = () => hardReset();
                    masterAudio.onerror = () => { fallbackSpeak(text, lang); };
                    await masterAudio.play();
                    return;
                } catch (e) { 
                    log("Voice Error -> System"); 
                }
            }
            fallbackSpeak(text, lang);
        }

        function fallbackSpeak(text, lang) {
            log("System Voice");
            if (!window.SpeechSynthesisUtterance) { hardReset(); return; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = (lang === 'my') ? 'my-MM' : 'en-US';
            u.onend = () => hardReset();
            window.speechSynthesis.speak(u);
        }

        async function testVoice() {
            log("Testing Voice...");
            await speak("System is stable and ready.", 'en-US');
        }

        function unlockAudio() {
            masterAudio.play().then(() => { masterAudio.pause(); }).catch(() => {});
            if (window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            window.removeEventListener('pointerdown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); start(lang, side); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); btn.releasePointerCapture(e.pointerId); stopRecording(); });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        
        document.addEventListener('deviceready', initSystem, false);
        // Fallback for laptop browser
        setTimeout(() => { if (!SpeechRecognition && !recognition) initSystem(); }, 1500);
    </script>
</body>
</html>
