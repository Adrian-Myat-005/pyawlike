<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Continuous</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body class="">
    <div id="debug-log" style="position:fixed;top:10px;left:10px;right:10px;max-height:40px;background:rgba(0,0,0,0.1);color:var(--text);font-family:monospace;font-size:10px;padding:5px;overflow:hidden;z-index:10000;border-radius:5px;pointer-events:none;opacity:0.5;">PyawLike Ready</div>
    
    <div class="top-nav" id="menuBtn"><div class="nav-dot"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">NATURAL VOICE <input type="checkbox" id="naturalSw" checked></div>
    </div>

    <div class="status-area">
        <div class="transcription" id="textDisplay">READY</div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('debug-log');
        const textDisplay = document.getElementById('textDisplay');
        const masterAudio = new Audio();
        let isRec = false, isProcessing = false, masterBuffer = '', finalBuffer = '', curLang = 'en-US';
        let wakeLock = null;
        let processingWatchdog = null;

        function log(msg) { 
            console.log(msg);
            logArea.innerText = msg; 
        }

        // --- GLOBAL SAFETY RESET ---
        function forceResetUI() {
            log("Force Resetting...");
            isRec = false;
            isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            textDisplay.innerText = "READY";
            textDisplay.style.color = "var(--text)";
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            masterAudio.pause();
            if (processingWatchdog) clearTimeout(processingWatchdog);
        }

        window.onerror = function(msg) {
            log("CRASH: " + msg);
            forceResetUI();
            return false;
        };

        // --- WAKE LOCK ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        });

        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 10000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (e) {
                clearTimeout(id);
                throw e;
            }
        }

        const themeSw = document.getElementById('themeSw');
        themeSw.addEventListener('change', () => document.body.classList.toggle('dark-mode', themeSw.checked));

        function unlockAudio() {
            log("Unlocking Audio...");
            if (window.SpeechSynthesisUtterance) {
                try { window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {}
            }
            masterAudio.play().then(() => {
                masterAudio.pause();
                masterAudio.currentTime = 0;
                log("Audio Unlocked");
            }).catch(() => {});
            window.removeEventListener('pointerdown', unlockAudio);
            requestWakeLock();
        }
        window.addEventListener('pointerdown', unlockAudio);

        function createRipple(e, btn) {
            const circle = document.createElement("span");
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - btn.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${e.clientY - btn.getBoundingClientRect().top - radius}px`;
            circle.classList.add("ripple");
            const ripple = btn.getElementsByClassName("ripple")[0];
            if (ripple) ripple.remove();
            btn.appendChild(circle);
        }

        let Speech = null;
        let recognition = null;

        function initSpeech() {
            Speech = (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.SpeechRecognition : null;
            if (Speech) {
                log("Capacitor Engine");
            } else if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
                log("Web Engine");
                const SpeechRecognition = window.webkitSpeechRecognition || window.speechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) masterBuffer += event.results[i][0].transcript;
                        else interimTranscript += event.results[i][0].transcript;
                    }
                    finalBuffer = (masterBuffer + interimTranscript).trim();
                    textDisplay.innerText = finalBuffer || "Listening...";
                };
                recognition.onerror = (event) => { if (event.error !== 'no-speech') log("Mic: " + event.error); };
                recognition.onend = () => { if (isRec) try { recognition.start(); } catch(e) {} };
            }
            checkPermissions();
        }

        async function checkPermissions() {
            if (Speech) {
                try {
                    const perm = await Speech.checkPermissions();
                    if (perm.speechRecognition !== 'granted') await Speech.requestPermissions();
                    log("Mic Ready");
                } catch (e) { log("Mic Error"); }
            }
        }

        async function runMic() {
            if (!isRec) return;
            try {
                if (Speech) await Speech.start({ language: curLang, partialResults: true, popup: false, continuous: true });
                else if (recognition) { recognition.lang = curLang; recognition.start(); }
            } catch (e) {
                log("Mic Fail");
                if (isRec) setTimeout(runMic, 1000);
            }
        }

        async function start(lang, side) {
            if (isRec || isProcessing) return;
            isRec = true;
            masterBuffer = '';
            finalBuffer = '';
            curLang = lang;
            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            textDisplay.innerText = "Listening...";
            textDisplay.style.color = "var(--accent)";
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            masterAudio.pause();
            if (Speech) {
                Speech.removeAllListeners();
                Speech.addListener('partialResults', (data) => {
                    if (data.matches && data.matches.length > 0) {
                        finalBuffer = (masterBuffer + " " + data.matches[0]).trim();
                        textDisplay.innerText = finalBuffer;
                    }
                });
                Speech.addListener('results', (data) => {
                    if (data.matches && data.matches.length > 0) masterBuffer = (masterBuffer + " " + data.matches[0]).trim();
                });
            }
            await runMic();
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false;
            isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            log("Processing...");

            // Safety Watchdog: If nothing happens for 15s, reset.
            processingWatchdog = setTimeout(() => {
                if (isProcessing) { log("Process Timeout"); forceResetUI(); }
            }, 15000);

            // Trigger stop, but don't await indefinitely
            if (Speech) { Speech.stop().catch(()=>{}); Speech.removeAllListeners(); }
            else if (recognition) { try { recognition.stop(); } catch(e) {} }

            setTimeout(async () => {
                if (finalBuffer) {
                    textDisplay.style.color = "var(--text)";
                    textDisplay.innerText = "..."; 
                    await translate(finalBuffer);
                } else {
                    forceResetUI();
                }
            }, 500);
        }

        async function translate(text) {
            log("Translating...");
            const isMM = curLang.startsWith('my');
            const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                const res = await fetchWithTimeout(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`, { timeout: 8000 });
                const data = await res.json();
                const translated = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = translated;
                await speak(translated, tl);
            } catch (e) { 
                log("Network Fail");
                textDisplay.innerText = "ERROR";
                setTimeout(forceResetUI, 2000);
            }
        }

        async function speak(text, lang) {
            log("Speaking...");
            const natural = document.getElementById('naturalSw').checked;
            let playedNatural = false;

            if (natural) {
                try {
                    const url = window.ENV?.SERVER_URL || window.location.origin;
                    const res = await fetchWithTimeout(`${url}/api/tts`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ text, lang, apiKey: window.ENV?.GEMINI_API_KEY }),
                        timeout: 10000
                    });
                    const data = await res.json();
                    if (data.audio) {
                        const b = new Blob([Uint8Array.from(atob(data.audio), c => c.charCodeAt(0))], {type:'audio/wav'});
                        const blobUrl = URL.createObjectURL(b);
                        masterAudio.src = blobUrl;
                        masterAudio.onended = () => { URL.revokeObjectURL(blobUrl); forceResetUI(); };
                        masterAudio.onerror = () => { URL.revokeObjectURL(blobUrl); fallbackSpeak(text, lang); };
                        await masterAudio.play();
                        playedNatural = true;
                        log("Gemini Voice OK");
                    }
                } catch (e) { log("Gemini Fallback"); }
            }
            if (!playedNatural) fallbackSpeak(text, lang);
        }

        function fallbackSpeak(text, lang) {
            if (!window.SpeechSynthesisUtterance) { forceResetUI(); return; }
            log("System Voice");
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = (lang === 'my') ? 'my-MM' : 'en-US';
            u.onend = () => forceResetUI();
            u.onerror = () => { log("TTS Error"); forceResetUI(); };
            window.speechSynthesis.speak(u);
            // Fallback watchdog for the fallback voice
            setTimeout(() => { if (isProcessing) forceResetUI(); }, 7000);
        }

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); createRipple(e, btn); start(lang, side); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); btn.releasePointerCapture(e.pointerId); stopRecording(); });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        document.addEventListener('deviceready', initSpeech, false);
        setTimeout(() => { if (!Speech && !recognition) initSpeech(); }, 2000);
    </script>
</body>
</html>
