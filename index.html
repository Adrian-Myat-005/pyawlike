<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike - Unstuck Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
</head>
<body class="dark-mode">
    <div id="debug-log" style="position:fixed; bottom:10px; left:10px; right:10px; height:60px; background:rgba(0,0,0,0.8); color:#0f0; font-family:monospace; font-size:10px; overflow-y:scroll; z-index:9999; pointer-events:none; border:1px solid #333; padding:5px;">Waiting...</div>

    <div class="top-nav">
        <div class="nav-dot" id="navDot"></div>
        <span class="perm-status" id="permStatus">OFF</span>
    </div>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="premium-menu-item">PREMIUM</button>
        <div class="menu-item"><span>NATURAL MODE</span><label class="switch small-switch"><input type="checkbox" id="naturalSwitch" checked><span class="slider"></span></label></div>
        <div class="menu-item"><span>SHOW TEXT</span><label class="switch small-switch"><input type="checkbox" id="showTextSwitch" checked><span class="slider"></span></label></div>
    </div>

    <div class="speaker-wrapper" id="speakerWrapper">
        <div class="text-display-area" id="transcription"></div>
        <div class="status-area">
            <div class="horizontal-waves" id="hWaves"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
            <div class="processing-loader" id="pLoader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
        </div>
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn left" id="btnMM"><span class="btn-label">MM</span></button>
            <button class="half-btn right" id="btnENG"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        // --- LOGGER SETUP ---
        const debugLog = document.getElementById('debug-log');
        function log(msg) {
            debugLog.innerHTML = `> ${msg}<br>` + debugLog.innerHTML;
            console.log(msg);
        }
        window.onerror = function(msg, url, line) { log(`ERROR: ${msg} line ${line}`); };

        // --- SETUP ---
        const btnMM = document.getElementById('btnMM'), btnENG = document.getElementById('btnENG');
        const speakerWrapper = document.getElementById('speakerWrapper'), hWaves = document.getElementById('hWaves'), pLoader = document.getElementById('pLoader');
        const transcription = document.getElementById('transcription'), permStatus = document.getElementById('permStatus');
        
        const masterAudio = new Audio();
        let isRecording = false, isTransitioning = false, finalBuffer = '', currentMicLang = 'en-US';
        const NativeSpeech = window.Capacitor ? Capacitor.Plugins.SpeechRecognition : null;

        async function requestMicAccess() {
            log("Checking Mic Permissions...");
            if (NativeSpeech) {
                try {
                    const status = await NativeSpeech.requestPermissions();
                    log("Native Perms: " + JSON.stringify(status));
                    updateSwitch(status.speechRecognition === 'granted' || status.microphone === 'granted');
                } catch (e) { log("Perm Error: " + e.message); }
            } else {
                try { await navigator.mediaDevices.getUserMedia({ audio: true }); updateSwitch(true); } catch(e){ updateSwitch(false); }
            }
        }
        function updateSwitch(active) { permStatus.textContent = active ? 'ON' : 'OFF'; permStatus.classList.toggle('active', active); }

        // --- BRAIN ---
        async function processTranslation(text) {
            log(`Processing: "${text}"`);
            const isBurmeseIn = currentMicLang === 'my-MM';
            const sl = isBurmeseIn ? 'my' : 'en';
            const tl = isBurmeseIn ? 'en' : 'my';
            
            if (document.getElementById('naturalSwitch').checked) {
                try {
                    const apiKey = window.ENV?.GEMINI_API_KEY;
                    if (!apiKey) throw new Error("Missing API Key");
                    log("Asking Gemini...");
                    
                    const prompt = `Translate this ${sl==='my'?'Burmese':'English'} text to ${tl==='my'?'Burmese':'English'} naturally. Input: "${text}". Return ONLY raw JSON: {"refined":"(corrected input)", "translated":"(natural translation)"}`;
                    
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await resp.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
                    const result = JSON.parse(jsonText);
                    log("Gemini Done.");
                    updateDisplay(result.refined, result.translated);
                    await speakLogic(result.translated, tl, true);
                    return;
                } catch (e) { log("Gemini Fail: " + e.message); }
            }

            // Fallback
            try {
                log("Asking Google...");
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                const translated = data[0].map(s => s[0]).join('').trim();
                log("Google Done.");
                updateDisplay(text, translated);
                await speakLogic(translated, tl, false);
            } catch (e) { log("Net Error: " + e.message); resetUI(); }
        }

        // --- VOICE ---
        async function speakLogic(text, lang, natural) {
            log(`Speaking (${lang})...`);
            // 1. Edge TTS
            try {
                const voice = lang === 'my' ? 'my-MM-NilarNeural' : 'en-US-AvaNeural';
                if (typeof EdgeTTS !== 'undefined' && EdgeTTS.EdgeTTS) {
                    const tts = new EdgeTTS.EdgeTTS();
                    await tts.speak({ text: text, voice: voice });
                    log("EdgeTTS Playing");
                    setTimeout(resetUI, (text.length * 100) + 1000); 
                    return;
                }
            } catch(e) { log("EdgeTTS Failed"); }

            // 2. Fallback
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(text)}`;
            masterAudio.src = url; 
            masterAudio.play();
            masterAudio.onended = resetUI;
            // Force reset after 10s if audio hangs
            setTimeout(resetUI, 10000);
        }

        // --- RECORDING ---
        async function startRecording(lang) {
            if (isTransitioning || isRecording) return;
            isTransitioning = true; finalBuffer = ''; currentMicLang = lang;
            log(`Mic Start (${lang})`);
            updateUIState('listening', lang);

            if (NativeSpeech) {
                try {
                    await NativeSpeech.start({ language: lang, maxResults: 1, partialResults: true, popup: false });
                    isRecording = true; isTransitioning = false;
                    NativeSpeech.addListener('partialResults', (data) => {
                        if (data.matches && data.matches.length > 0) {
                            finalBuffer = data.matches[0];
                            if(document.getElementById('showTextSwitch').checked) transcription.innerHTML = `<div class="live-line">${finalBuffer}</div>`;
                        }
                    });
                } catch (e) { log("Mic Start Fail: " + e.message); resetUI(); }
            } else {
                // Browser Fallback (Legacy)
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(!SR) { log("SpeechRecognition not supported"); resetUI(); return; }
                const br = new SR();
                window.browserRecognition = br;
                br.continuous = true; br.interimResults = true; br.lang = lang;
                br.onstart = () => { isRecording = true; isTransitioning = false; };
                br.onresult = (e) => {
                    let t = ''; for(let i = e.resultIndex; i < e.results.length; ++i) t += e.results[i][0].transcript;
                    finalBuffer = t;
                    if(document.getElementById('showTextSwitch').checked) transcription.innerHTML = `<div class="live-line">${t}</div>`;
                };
                br.start();
            }
        }

        async function stopRecording() {
            if (!isRecording) return;
            log("Stopping Mic...");
            
            // 1. Silent Unlock
            masterAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABBTZGF0YQQAAAAAAAAAAAA=";
            masterAudio.play().catch(()=>{});

            isRecording = false; isTransitioning = true; updateUIState('processing');

            // 2. FORCE STOP (Do not await)
            if (NativeSpeech) { 
                NativeSpeech.stop().catch(e => log("Stop Error (Ignored): " + e));
                NativeSpeech.removeAllListeners(); 
            } else if (window.browserRecognition) {
                window.browserRecognition.stop();
            }

            // 3. FORCE PROCESSING (Wait 500ms for last text, then GO)
            setTimeout(() => {
                log(`Final Text: "${finalBuffer}"`);
                if (finalBuffer.trim()) processTranslation(finalBuffer);
                else { log("No text heard."); resetUI(); }
            }, 500);
        }

        function updateDisplay(sub, main) { transcription.innerHTML = `<div class="roll-line"><div class="source-subtext">${sub}</div><div class="translation-main">${main}</div></div>`; }
        function updateUIState(s, l) { hWaves.classList.toggle('active', s==='listening'); pLoader.classList.toggle('active', s==='processing'); speakerWrapper.className = s==='listening'?(l==='my-MM'?'speaker-wrapper is-active-left':'speaker-wrapper is-active-right'):'speaker-wrapper'; }
        function resetUI() { log("Reset UI"); isRecording=false; isTransitioning=false; updateUIState('ready'); }
        
        btnMM.addEventListener('mousedown', (e) => { e.preventDefault(); if(!isTransitioning) isRecording ? stopRecording() : startRecording('my-MM'); });
        btnENG.addEventListener('mousedown', (e) => { e.preventDefault(); if(!isTransitioning) isRecording ? stopRecording() : startRecording('en-US'); });
        document.getElementById('navDot').addEventListener('click', (e)=>{e.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('active');});
        document.addEventListener('click', (e)=>{if(!document.getElementById('navDot').contains(e.target)) document.getElementById('dropdownMenu').classList.remove('active');});
        (async()=>{ await requestMicAccess(); })();
    </script>
</body>
</html>
