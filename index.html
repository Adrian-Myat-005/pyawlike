<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PyawLike Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <!-- Golden Standard TTS Engine -->
    <script src="https://cdn.jsdelivr.net/npm/edge-tts-universal/dist/browser.js"></script>
    <style>
        :root { --circle-size: clamp(220px, 55vw, 320px); }
        .speaker-wrapper { width: var(--circle-size); height: var(--circle-size); }
        .transcription { font-size: clamp(20px, 5vw, 28px); padding: 0 25px; min-height: 60px; }
        .reset-btn { background: #ff4444; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 800; width: 100%; margin-top: 15px; cursor: pointer; font-size: 12px; }
        .status-badge { font-size: 10px; font-weight: 900; letter-spacing: 1px; margin-bottom: 10px; opacity: 0.5; }
    </style>
</head>
<body class="">
    <div id="debug-log" style="position:fixed;top:10px;left:10px;right:10px;max-height:40px;background:rgba(0,0,0,0.05);color:var(--text);font-family:monospace;font-size:10px;padding:5px;overflow:hidden;z-index:10000;border-radius:5px;pointer-events:none;opacity:0.6;">System Initializing...</div>
    
    <div class="top-nav" id="menuBtn"><div class="nav-dot"></div></div>
    <div class="dropdown" id="menu">
        <div class="menu-item">DARK MODE <input type="checkbox" id="themeSw"></div>
        <div class="menu-item">SHOW TEXT <input type="checkbox" id="textSw" checked></div>
        <div class="menu-item">NATURAL VOICE <input type="checkbox" id="naturalSw" checked></div>
        <button class="reset-btn" onclick="hardReset()">HARD RESET SYSTEM</button>
    </div>

    <div class="status-area">
        <div class="status-badge" id="stateBadge">READY</div>
        <div class="transcription" id="textDisplay">HOLD TO SPEAK</div>
    </div>

    <div class="speaker-wrapper">
        <div class="split-btn-container" id="mainCircle">
            <button class="half-btn" id="btnMM" data-lang="my-MM" data-side="left"><span class="btn-label">MM</span></button>
            <button class="half-btn" id="btnENG" data-lang="en-US" data-side="right"><span class="btn-label">ENG</span></button>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('debug-log');
        const textDisplay = document.getElementById('textDisplay');
        const stateBadge = document.getElementById('stateBadge');
        const masterAudio = new Audio();
        
        let isRec = false, isProcessing = false;
        let curLang = 'en-US', currentTranscript = '';
        let wakeLock = null;

        function log(msg) { logArea.innerText = msg; console.log(msg); }
        function setUIState(state) {
            stateBadge.innerText = state;
            if (state === 'LISTENING') textDisplay.style.color = "var(--accent)";
            else if (state === 'READY') textDisplay.style.color = "var(--text)";
        }

        async function hardReset() {
            log("Hard Resetting...");
            isRec = false; isProcessing = false;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('READY');
            textDisplay.innerText = "READY";
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            masterAudio.pause();
            if (Speech) {
                try { await Speech.stop(); } catch(e) {}
                Speech.removeAllListeners();
            }
        }

        // --- PHASE 1: MICROPHONE (GOLDEN STANDARD) ---
        let Speech = null;
        let recognition = null;

        async function initSpeech() {
            Speech = (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.SpeechRecognition : null;
            
            if (Speech) {
                try {
                    const avail = await Speech.available();
                    if (avail.available) {
                        log("Native Mic Engine Loaded");
                        const perm = await Speech.checkPermissions();
                        if (perm.speechRecognition !== 'granted') await Speech.requestPermissions();
                    }
                } catch (e) { log("Mic Init Fail"); }
            } else if ('webkitSpeechRecognition' in window) {
                log("Web Mic Engine Loaded");
                recognition = new webkitSpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let full = '';
                    for (let i = 0; i < e.results.length; ++i) full += e.results[i][0].transcript;
                    currentTranscript = full.trim();
                    textDisplay.innerText = currentTranscript || "Listening...";
                };
                recognition.onend = () => { if (isRec) try { recognition.start(); } catch(e) {} };
            }
        }

        async function start(lang, side) {
            if (isRec || isProcessing) return;
            
            // Clean slate based on CodersSmile logic
            if (Speech) {
                const check = await Speech.isListening();
                if (check.listening) await Speech.stop();
                Speech.removeAllListeners();
            }

            isRec = true;
            currentTranscript = '';
            curLang = lang;
            
            setUIState('LISTENING');
            document.body.classList.add(side === 'left' ? 'active-left' : 'active-right');
            textDisplay.innerText = "Listening...";

            if (Speech) {
                Speech.addListener('partialResults', (data) => {
                    if (data.matches && data.matches.length > 0) {
                        currentTranscript = data.matches[0];
                        textDisplay.innerText = currentTranscript;
                    }
                });
                try {
                    await Speech.start({ language: curLang, partialResults: true, popup: false, continuous: true });
                } catch (e) { log("Mic Start Error"); isRec = false; }
            } else if (recognition) {
                recognition.lang = curLang;
                try { recognition.start(); } catch(e) {}
            }
        }

        async function stopRecording() {
            if (!isRec) return;
            isRec = false;
            isProcessing = true;
            document.body.classList.remove('active-left', 'active-right');
            setUIState('THINKING');

            if (Speech) {
                try { await Speech.stop(); } catch(e) {}
            } else if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            setTimeout(async () => {
                if (currentTranscript) {
                    textDisplay.innerText = "...";
                    await processPipeline(currentTranscript);
                } else {
                    hardReset();
                }
            }, 800);
        }

        // --- PHASE 2: LOGIC PIPELINE (PIPELINE REFERENCE) ---
        async function processPipeline(text) {
            log("Translating...");
            const isMM = curLang.startsWith('my');
            const sl = isMM ? 'my' : 'en', tl = isMM ? 'en' : 'my';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                const result = data[0].map(s => s[0]).join('').trim();
                textDisplay.innerText = result;
                await speak(result, tl);
            } catch (e) { log("Pipeline Error"); hardReset(); }
        }

        // --- PHASE 3: VOICE OUTPUT (EDGE TTS REFERENCE) ---
        async function speak(text, lang) {
            setUIState('SPEAKING');
            const natural = document.getElementById('naturalSw').checked;
            let success = false;

            if (natural) {
                try {
                    log("Edge TTS Synthetic...");
                    // Use Edge TTS Universal (Golden Standard for web output)
                    const tts = new EdgeTTS.EdgeTTS();
                    // Multi-lingual mapping for all android devices
                    const voice = (lang === 'my') ? 'my-MM-ThihaNeural' : 'en-US-AvaMultilingualNeural';
                    await tts.setVoice(voice);
                    const audioData = await tts.synthesize(text);
                    const blob = new Blob([audioData], { type: 'audio/mp3' });
                    const url = URL.createObjectURL(blob);
                    
                    masterAudio.src = url;
                    masterAudio.onended = () => { URL.revokeObjectURL(url); hardReset(); };
                    masterAudio.onerror = () => { URL.revokeObjectURL(url); fallbackSpeak(text, lang); };
                    await masterAudio.play();
                    success = true;
                } catch (e) { 
                    log("AI Voice Offline - Falling back");
                }
            }

            if (!success) {
                fallbackSpeak(text, lang);
            }
        }

        function fallbackSpeak(text, lang) {
            log("System Voice");
            if (!window.SpeechSynthesisUtterance) { hardReset(); return; }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = (lang === 'my') ? 'my-MM' : 'en-US';
            u.onend = () => hardReset();
            u.onerror = () => hardReset();
            window.speechSynthesis.speak(u);
        }

        // --- UI & LIFECYCLE ---
        function unlockAudio() {
            masterAudio.play().then(() => { masterAudio.pause(); }).catch(() => {});
            if (window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            window.removeEventListener('pointerdown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);

        function attach(id, lang, side) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); start(lang, side); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); btn.releasePointerCapture(e.pointerId); stopRecording(); });
        }

        attach('btnMM', 'my-MM', 'left');
        attach('btnENG', 'en-US', 'right');
        document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('menu').classList.toggle('open'));
        document.getElementById('themeSw').addEventListener('change', () => document.body.classList.toggle('dark-mode'));

        document.addEventListener('deviceready', initSpeech, false);
        setTimeout(() => { if (!Speech && !recognition) initSpeech(); }, 2000);
    </script>
</body>
</html>
