name: Final Super APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- SETUP ENVIRONMENT (UPDATED TO JAVA 21) ---
      - name: Setup Node.js & Java
        uses: actions/setup-node @v4
        with: { node-version: 20 }
      - name: Setup Java
        uses: actions/setup-java @v4
        with: 
          distribution: 'zulu'
          java-version: '21'   # <--- FIXED: Upgrade to Java 21

      # --- MAGIC FOLDER TRICK ---
      - name: Prepare Web Assets
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android

      # --- INSTALL & CONFIGURE CAPACITOR ---
      - name: Install Capacitor & Android
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          
          # Install Capacitor tools
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Initialize the App
          npx cap init "VibeApp" "com.vibe.code" --web-dir=www

          # Add Android Platform
          npx cap add android

      # --- BUILD THE APK ---
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- UPLOAD ARTIFACT ---
      - name: Upload APK
        uses: actions/upload-artifact @v4
        with:
          name: vibe-app-final
          path: android/app/build/outputs/apk/debug/app-debug.apk
