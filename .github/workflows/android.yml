name: Final Super APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- SETUP ENVIRONMENT ---
      - name: Setup Node.js & Java
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }

      # --- MAGIC FOLDER TRICK ---
      # Moves your HTML/JS/CSS into a 'www' folder so Capacitor can find it
      - name: Prepare Web Assets
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android

      # --- INSTALL & CONFIGURE CAPACITOR ---
      - name: Install Capacitor & Android
        run: |
          # Create package.json if missing
          if [ ! -f package.json ]; then npm init -y; fi
          
          # Install Capacitor tools
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Initialize the App (You can change 'VibeApp' to your name)
          npx cap init "VibeApp" "com.vibe.code" --web-dir=www

          # Add Android Platform
          npx cap add android

      # --- BUILD THE APK ---
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- UPLOAD ARTIFACT (FIXED: v4) ---
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-app-final
          path: android/app/build/outputs/apk/debug/app-debug.apk