name: Final God Mode APK Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }

      - name: Prepare Assets & Inject Key
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android
          echo 'window.ENV = { GEMINI_API_KEY: "AIzaSyCPrA6Mtf6YsuxY67H6GzAwlSItcdzMWRU" };' > www/config.js

      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor-community/speech-recognition@latest

      - name: Init Android
        run: |
          npx cap init "PyawLike" "com.pyawlike.app" --web-dir=www
          npx cap add android

      - name: Register Plugin in Java
        run: |
          cd android/app/src/main/java/com/pyawlike/app
          sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport com.getcapacitor.community.speechrecognition.SpeechRecognition;/' MainActivity.java
          sed -i 's/public class MainActivity extends BridgeActivity {}/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(SpeechRecognition.class);\n    }\n}/' MainActivity.java

      - name: Force Permissions
        run: |
          cd android/app/src/main
          rm AndroidManifest.xml
          cat <<XML > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.pyawlike.app">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/AppTheme" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:label="@string/title_activity_main" android:theme="@style/AppTheme.NoActionBarLaunch" android:launchMode="singleTask" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

      - name: Inject Icon
        run: |
          if [ -f icon.png ]; then
            RES="android/app/src/main/res"
            for d in $RES/mipmap-*; do cp icon.png "$d/ic_launcher.png"; cp icon.png "$d/ic_launcher_round.png"; done
            rm -rf "$RES/mipmap-anydpi-v26"
          fi

      - name: Fix Kotlin
        run: |
          cd android
          echo "allprojects { configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0' } } }" >> build.gradle

      - name: Build & Upload
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: pyawlike-debug-logger, path: android/app/build/outputs/apk/debug/app-debug.apk }
