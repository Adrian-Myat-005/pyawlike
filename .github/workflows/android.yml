name: Final God Mode APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout @v4

      # --- SETUP ENVIRONMENT ---
      - name: Setup Node 22
        uses: actions/setup-node @v4
        with: { node-version: 22 }

      - name: Setup Java 21
        uses: actions/setup-java @v4
        with: { distribution: 'zulu', java-version: '21' }

      # --- PREPARE ASSETS ---
      - name: Prepare Web Assets
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android

      # --- INSTALL CAPACITOR ---
      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # --- INIT ANDROID ---
      - name: Initialize Android
        run: |
          npx cap init "PyawLike" "com.pyawlike.app" --web-dir=www
          npx cap add android

      # --- 🔥 PERMISSION INJECTION (SAFER METHOD) 🔥 ---
      # We insert the permissions right after the <manifest> tag starts.
      # This guarantees they are seen by Android.
      - name: Inject Manifest Permissions
        run: |
          cd android/app/src/main
          
          # Insert permissions at line 3 (right after <manifest...>)
          sed -i '3i <uses-permission android:name="android.permission.RECORD_AUDIO" />' AndroidManifest.xml
          sed -i '3i <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' AndroidManifest.xml
          sed -i '3i <uses-permission android:name="android.permission.INTERNET" />' AndroidManifest.xml
          
          # Enable Cleartext Traffic (for local network/audio issues)
          sed -i 's/android:allowBackup="true"/android:allowBackup="true" android:usesCleartextTraffic="true"/' AndroidManifest.xml
          
          # PRINT THE FILE to the build logs (so we can check if it worked)
          cat AndroidManifest.xml

      # --- 🎨 INJECT ICON ---
      - name: Inject Custom Icon
        run: |
          if [ -f icon.png ]; then
            RES="android/app/src/main/res"
            for d in $RES/mipmap-*; do
              cp icon.png "$d/ic_launcher.png"
              cp icon.png "$d/ic_launcher_round.png"
            done
            rm -rf "$RES/mipmap-anydpi-v26"
          fi

      # --- 🔧 FIX KOTLIN CONFLICT ---
      - name: Inject Resolution Strategy
        run: |
          cd android
          cat <<EOT >> build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
                  }
              }
          }
          EOT

      # --- BUILD ---
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- UPLOAD ---
      - name: Upload APK
        uses: actions/upload-artifact @v4
        with:
          name: pyawlike-app-permission-fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk