name: Final God Mode APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout @v4

      # --- SETUP ENVIRONMENT ---
      - name: Setup Node 22
        uses: actions/setup-node @v4
        with: { node-version: 22 }

      # --- Use Java 21 ---
      - name: Setup Java 21
        uses: actions/setup-java @v4
        with: { distribution: 'zulu', java-version: '21' }

      # --- PREPARE ASSETS ---
      - name: Prepare Web Assets
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android

      # --- INSTALL CAPACITOR ---
      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # --- INIT ANDROID ---
      - name: Initialize Android
        run: |
          npx cap init "PyawLike" "com.pyawlike.app" --web-dir=www
          npx cap add android

      # --- 🔥 THE NUCLEAR MANIFEST OVERWRITE 🔥 ---
      # We DELETE the auto-generated file and write our own with permissions HARDCODED.
      - name: Overwrite AndroidManifest.xml
        run: |
          cd android/app/src/main
          rm AndroidManifest.xml
          
          # Write the new file with RECORD_AUDIO and INTERNET permissions
          cat <<XML > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.pyawlike.app">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="\${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          XML
          
          # Print to verify
          cat AndroidManifest.xml

      # --- 🎨 INJECT ICON ---
      - name: Inject Custom Icon
        run: |
          if [ -f icon.png ]; then
            RES="android/app/src/main/res"
            for d in $RES/mipmap-*; do
              cp icon.png "$d/ic_launcher.png"
              cp icon.png "$d/ic_launcher_round.png"
            done
            rm -rf "$RES/mipmap-anydpi-v26"
          fi

      # --- 🔧 FIX KOTLIN CONFLICT ---
      - name: Inject Resolution Strategy
        run: |
          cd android
          cat <<EOT >> build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
                  }
              }
          }
          EOT

      # --- BUILD ---
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- UPLOAD ---
      - name: Upload APK
        uses: actions/upload-artifact @v4
        with:
          name: pyawlike-app-fixed-manifest
          path: android/app/build/outputs/apk/debug/app-debug.apk
