name: Hybrid Mic APK Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }

      - name: Prepare Config
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android
          echo 'window.ENV = { SERVER_URL: "https://pyawlike.vercel.app" };' > www/config.js

      - name: Install Hybrid Dependencies
        run: |
          rm -rf package-lock.json node_modules android
          npm install

      - name: Build Android
        run: |
          npx cap init "PyawLike" "com.pyawlike.app" --web-dir=www
          npx cap add android
          
          # 🔥 THIS IS CRITICAL. IT LINKS THE MIC PLUGIN. 🔥
          npx cap sync android

      - name: Permissions
        run: |
            cd android/app/src/main
            rm AndroidManifest.xml
            cat <<XML > AndroidManifest.xml
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.pyawlike.app">
                <uses-permission android:name="android.permission.RECORD_AUDIO" />
                <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                <uses-permission android:name="android.permission.INTERNET" />
                <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                <queries>
                    <intent>
                        <action android:name="android.speech.RecognitionService" />
                    </intent>
                </queries>
                <application 
                    android:allowBackup="true" 
                    android:icon="@mipmap/ic_launcher" 
                    android:label="@string/app_name" 
                    android:roundIcon="@mipmap/ic_launcher_round" 
                    android:theme="@style/AppTheme" 
                    android:usesCleartextTraffic="true"
                    android:largeHeap="true"
                    android:hardwareAccelerated="true">
                    <activity 
                        android:name=".MainActivity" 
                        android:label="@string/title_activity_main" 
                        android:theme="@style/AppTheme.NoActionBarLaunch" 
                        android:launchMode="singleTask" 
                        android:exported="true"
                        android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                        <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                    </activity>
                </application>
            </manifest>
            XML

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with: { name: pyawlike-hybrid-mic, path: android/app/build/outputs/apk/debug/app-debug.apk }
