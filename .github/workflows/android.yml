name: Final God Mode APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout @v4

      # --- SETUP ENVIRONMENT ---
      - name: Setup Node 22 (Required for Cap v7)
        uses: actions/setup-node @v4
        with: { node-version: 22 }

      - name: Setup Java 21 (Required for Android 15)
        uses: actions/setup-java @v4
        with: { distribution: 'zulu', java-version: '21' }

      # --- PREPARE ASSETS ---
      - name: Prepare Web Assets
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android

      # --- INSTALL CAPACITOR ---
      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # --- INIT ANDROID ---
      - name: Initialize Android
        run: |
          npx cap init "PyawLike" "com.pyawlike.app" --web-dir=www
          npx cap add android

      # --- 🔥 STEP 1: INJECT MIC PERMISSIONS 🔥 ---
      # This command finds the <application> tag and adds permissions right before it.
      - name: Inject Permissions
        run: |
          cd android/app/src/main
          # We insert RECORD_AUDIO and MODIFY_AUDIO_SETTINGS
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' AndroidManifest.xml
          
          # Print it just to be sure (optional, for logs)
          cat AndroidManifest.xml

      # --- 🔥 STEP 2: FIX KOTLIN CONFLICT 🔥 ---
      - name: Inject Resolution Strategy
        run: |
          cd android
          cat <<EOT >> build.gradle
          
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
                  }
              }
          }
          EOT

      # --- BUILD ---
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- UPLOAD ---
      - name: Upload APK
        uses: actions/upload-artifact @v4
        with:
          name: pyawlike-app-final
          path: android/app/build/outputs/apk/debug/app-debug.apk
