name: Safe Mode APK Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Standard Environment
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }

      - name: Prepare Web Assets
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android
          # Inject Vercel URL
          echo 'window.ENV = { SERVER_URL: "https://pyawlike.vercel.app" };' > www/config.js

      - name: Install Safe Dependencies
        run: |
          rm -rf package-lock.json node_modules android
          npm install

      - name: Build Android (No Plugins)
        run: |
          npx cap init "PyawLike" "com.pyawlike.app" --web-dir=www
          npx cap add android
          # Just sync the web files, no native plugin linking needed
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with: { name: pyawlike-safe-mode, path: android/app/build/outputs/apk/debug/app-debug.apk }