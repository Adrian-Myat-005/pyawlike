name: Final God Mode APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout @v4

      # --- SETUP ENVIRONMENT (The Perfect Combo) ---
      - name: Setup Node 22 (Required for Cap v7)
        uses: actions/setup-node @v4
        with: { node-version: 22 }

      - name: Setup Java 21 (Required for Android 15 builds)
        uses: actions/setup-java @v4
        with: { distribution: 'zulu', java-version: '21' }

      # --- PREPARE ASSETS ---
      - name: Prepare Web Assets
        run: |
          mkdir www
          rsync -av . www --exclude www --exclude node_modules --exclude .git --exclude .github --exclude android

      # --- INSTALL CAPACITOR ---
      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          # Force install latest versions
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # --- INIT ANDROID ---
      - name: Initialize Android
        run: |
          npx cap init "PyawLike" "com.pyawlike.app" --web-dir=www
          npx cap add android

      # --- 🔥 THE GOD MODE FIX (Force Kotlin Version) 🔥 ---
      - name: Inject Resolution Strategy
        run: |
          cd android
          # This forces the project to agree on ONE Kotlin version
          cat <<EOT >> build.gradle
          
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
                  }
              }
          }
          EOT

      # --- BUILD ---
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- UPLOAD ---
      - name: Upload APK
        uses: actions/upload-artifact @v4
        with:
          name: pyawlike-app-final
          path: android/app/build/outputs/apk/debug/app-debug.apk